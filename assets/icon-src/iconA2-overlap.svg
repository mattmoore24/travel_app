<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 1024 1024">
  <!-- A2: filled rather than outlined — solid shapes hold their shape at 60px
       where strokes thin out and blur together. -->
  <defs>
    <clipPath id="lc2"><circle cx="392" cy="512" r="248"/></clipPath>
  </defs>
  <rect width="1024" height="1024" fill="#2A4C9B"/>
  <circle cx="392" cy="512" r="248" fill="#FBFAF7"/>
  <circle cx="632" cy="512" r="248" fill="#FBFAF7"/>
  <circle cx="632" cy="512" r="248" fill="#F0A93C" clip-path="url(#lc2)"/>
</svg>
