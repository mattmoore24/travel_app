<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 1024 1024">
  <!-- B2: the paths CROSS and continue past each other rather than stopping in
       an arch. Two journeys that intersect, not a bridge. -->
  <rect width="1024" height="1024" fill="#2A4C9B"/>
  <g fill="none" stroke="#FBFAF7" stroke-width="64" stroke-linecap="round">
    <path d="M 248 826 C 300 560, 420 400, 700 250"/>
    <path d="M 776 826 C 724 560, 604 400, 324 250"/>
  </g>
  <circle cx="512" cy="486" r="96" fill="#F0A93C"/>
</svg>
