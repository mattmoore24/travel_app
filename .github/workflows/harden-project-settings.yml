# Sets the hosted-project settings that live in the Supabase dashboard and
# nowhere in this repository — the ones docs/security/MANUAL_CHECKLIST.md §2
# used to ask the founder to click through by hand.
#
# WHY A WORKFLOW AND NOT A MIGRATION. Exposed schemas, leaked-password
# protection, anonymous sign-ins and the storage ceiling are project
# configuration, not database objects. `supabase db push` cannot reach any of
# them and neither can SQL: the one that matters most, SEC-002, was proved to
# be unreachable from a migration by measuring the attempted revoke on the live
# database inside a rolled-back transaction. So it goes through the Management
# API, which is the same door .github/scripts/enable-apple-provider.mjs uses.
#
# DELIBERATELY NOT PART OF supabase-deploy.yml. A deploy runs on every commit
# to supabase/.deploy-request; this changes the shape of the project's API
# surface and should be a thing somebody decides to do, with the run visible on
# its own. It NEVER fires on an ordinary code push: the only push that starts
# it is a commit to `.github/harden-request`, a file that exists for no other
# reason, which is the same idiom supabase/.deploy-request and
# .github/apple-revoke-request use.
#
# THE BUTTON EXISTS NOW. This file reached the default branch on 2026-09-09, so
# Actions -> Harden project settings -> Run workflow is live and is the easier
# door. The request file remains the way to run it from a working branch before
# that branch is merged: GitHub resolves a dispatch's workflow id on the default
# branch, so a workflow_dispatch on a file that exists only on a feature branch
# answers 404, while a `push:` trigger runs the version on the branch pushed.
# On the default branch itself the file no longer works - see branches-ignore
# below, and use the button there.
#
# WHAT THE FILE SAYS IS THE MODE. Its first word: `check` reads and reports and
# writes nothing, `apply` writes. Anything else, including an empty file, is
# read as `check` — a run that writes should be one somebody typed the word
# for, and a stray commit to this path must not change the project.
#
# Secrets, both already set for supabase-deploy.yml:
#   SUPABASE_ACCESS_TOKEN   personal access token
#   SUPABASE_PROJECT_REF    the ref in https://<ref>.supabase.co
#
# Two ways to run it:
#   * Put `check` or `apply` in `.github/harden-request` and commit it (works
#     from any branch, and is the only way until this file is on the default
#     branch).
#   * Actions -> Harden project settings -> Run workflow.
name: Harden project settings

on:
  push:
    # A REF MOVE MUST NEVER START THIS. The default branch is far behind this
    # one, and a fast-forward puts every request file ever touched into a
    # single push diff - GitHub evaluates `paths` over the whole before..after
    # range, so the catch-up push alone would start this workflow with nobody
    # having chosen it. This is SEC-017 narrowed to the case that bites: the
    # audit declined a `branches:` allowlist because it would break the way
    # this project ships (a request file committed on whatever branch the work
    # is on), and ignoring the trunk alone leaves that flow untouched.
    branches-ignore:
      - 'claude/travel-app-initial-setup-ephphz'
    paths:
      - '.github/harden-request'
  workflow_dispatch:
    inputs:
      mode:
        description: 'check = read and report only. apply = write the settings.'
        type: choice
        options:
          - check
          - apply
        default: check

concurrency:
  group: harden-project-settings
  cancel-in-progress: false

jobs:
  harden:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      PROJECT_REF: ${{ secrets.SUPABASE_PROJECT_REF }}
      # A push carries no inputs, so the mode comes off the request file. The
      # step below narrows whatever it finds to exactly `check` or `apply`.
      RAW_MODE: ${{ inputs.mode }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Check required secrets
        run: |
          missing=()
          [ -n "$SUPABASE_ACCESS_TOKEN" ] || missing+=(SUPABASE_ACCESS_TOKEN)
          [ -n "$PROJECT_REF" ] || missing+=(SUPABASE_PROJECT_REF)
          if [ ${#missing[@]} -gt 0 ]; then
            echo "::error::Missing repository secrets: ${missing[*]}"
            echo "Add them under Settings then Secrets and variables then Actions."
            exit 1
          fi

      - name: Decide the mode
        run: |
          mode="$RAW_MODE"
          if [ -z "$mode" ] && [ -f .github/harden-request ]; then
            mode=$(head -n 1 .github/harden-request | tr -d '[:space:]')
          fi
          # Anything that is not the literal word `apply` reads as `check`, so
          # the failure mode of a typo, an empty file or a missing one is a
          # read rather than a write.
          if [ "$mode" != "apply" ]; then
            mode=check
          fi
          echo "Mode: $mode"
          echo "MODE=$mode" >> "$GITHUB_ENV"

      - name: Set them
        run: node .github/scripts/harden-project-settings.mjs
