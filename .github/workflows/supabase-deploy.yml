# Applies database migrations and deploys Edge Functions to the hosted
# Supabase project. Exists because the project is developed from devices that
# can't run the Supabase CLI (phone/tablet) — GitHub's runners can.
#
# Required repository secrets (Settings → Secrets and variables → Actions):
#   SUPABASE_ACCESS_TOKEN   personal access token (supabase.com/dashboard/account/tokens)
#   SUPABASE_PROJECT_REF    the ref in https://<ref>.supabase.co
#   SUPABASE_DB_PASSWORD    database password chosen when the project was created
# Optional:
#   ANTHROPIC_API_KEY       synced to Edge Function secrets for moderation-worker
#   MODERATION_PROMPTS      classifier system prompts (JSON) — kept out of this
#                           public repo; see moderation-worker/prompts.example.json
#   MODERATION_PROMPTS_BUSINESS
#                           the two business prompts, as their own secret so the
#                           three live ones never have to be retyped (a GitHub
#                           secret is write-only, so it cannot be appended to)
#
# Two ways to run it:
#   * Commit any change to supabase/.deploy-request (works from any branch).
#   * Actions → Supabase deploy → Run workflow (needs this file on the default
#     branch; GitHub only lists workflow_dispatch workflows from there).
name: Supabase deploy

on:
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Only list migrations that would be applied'
        type: boolean
        default: false
  push:
    paths:
      - 'supabase/.deploy-request'

# Never let two deploys touch the same database at once.
concurrency:
  group: supabase-deploy
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      # Pinned: the flags used below were verified against this version.
      SUPABASE_CLI: supabase@2.114.0
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      PROJECT_REF: ${{ secrets.SUPABASE_PROJECT_REF }}
      DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
      ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
      MODERATION_PROMPTS: ${{ secrets.MODERATION_PROMPTS }}
      MODERATION_PROMPTS_BUSINESS: ${{ secrets.MODERATION_PROMPTS_BUSINESS }}
      RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
      # A literal, not a secret, on the founder's 2026-08-31 instruction: the
      # secret held a personal gmail from before the domain existed, and the
      # address is public on every page link.samewhere.io serves — there is
      # nothing to hide and one thing to get wrong. The old SUPPORT_INBOX
      # repo secret is no longer read and can be deleted.
      SUPPORT_INBOX: hello@samewhere.io
      SUPPORT_FROM: ${{ secrets.SUPPORT_FROM }}
      ANON_KEY: ${{ secrets.EXPO_PUBLIC_SUPABASE_ANON_KEY }}
      PROJECT_URL: ${{ secrets.EXPO_PUBLIC_SUPABASE_URL }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Check required secrets
        run: |
          missing=()
          [ -n "$SUPABASE_ACCESS_TOKEN" ] || missing+=(SUPABASE_ACCESS_TOKEN)
          [ -n "$PROJECT_REF" ] || missing+=(SUPABASE_PROJECT_REF)
          [ -n "$DB_PASSWORD" ] || missing+=(SUPABASE_DB_PASSWORD)
          if [ ${#missing[@]} -gt 0 ]; then
            echo "::error::Missing repository secrets: ${missing[*]}"
            echo "Add them under Settings → Secrets and variables → Actions."
            exit 1
          fi

      - name: Migrations — before
        run: npx --yes "$SUPABASE_CLI" migration list --project-ref "$PROJECT_REF" -p "$DB_PASSWORD"

      - name: Apply migrations
        if: ${{ inputs.dry_run != true }}
        run: npx --yes "$SUPABASE_CLI" db push --project-ref "$PROJECT_REF" -p "$DB_PASSWORD"

      - name: Deploy Edge Functions
        if: ${{ inputs.dry_run != true }}
        # --use-api bundles server-side, so the runner needs no Docker.
        run: npx --yes "$SUPABASE_CLI" functions deploy --project-ref "$PROJECT_REF" --use-api

      # `functions deploy` reporting success means the code was uploaded. It
      # says NOTHING about whether the function runs: a bad import fails at
      # the first invocation, and the worker then does nothing, every minute,
      # while every check stays green. That is exactly how moderation went
      # down on 2026-08-21 — first messages held and never released — and the
      # only thing that noticed was the ten-minute live-backend suite.
      #
      # One POST each, carrying the ANON key — the credential that ships
      # inside the app. The only acceptable answer is 401: the workers are
      # service-role-only, so anon must be refused. That single assertion
      # catches all three ways this has gone wrong or could:
      #   5xx / 000  the function is not running (a bad import, a bad deploy)
      #   2xx        the guard is missing or is letting the anon key through
      #   401        alive, and refusing the key an attacker would have
      #
      # Nothing runs as a side effect any more — the call is refused before
      # the worker does anything — so all three are checked, including
      # support-mailer, which the earlier version had to skip because
      # invoking it unconfigured would have failed every deploy.
      - name: Prove the workers actually respond
        if: ${{ inputs.dry_run != true && env.ANON_KEY != '' && env.PROJECT_URL != '' }}
        run: |
          fail=0
          for fn in moderation-worker push-worker support-mailer guest-janitor; do
            body=$(mktemp)
            code=$(curl -sS -o "$body" -w '%{http_code}' -X POST \
              -H "Authorization: Bearer $ANON_KEY" \
              -H "Content-Type: application/json" \
              "$PROJECT_URL/functions/v1/$fn" || echo 000)
            case "$code" in
              401)
                echo "$fn refused the anon key ($code) — alive and guarded."
                ;;
              2*)
                echo "::error::$fn ACCEPTED the anon key ($code). It is running, but"
                echo "::error::the service-role guard is missing or not refusing. The"
                echo "::error::anon key ships inside the app."
                fail=1
                ;;
              *)
                echo "::error::$fn responded $code and is not running. First 300 bytes:"
                head -c 300 "$body" || true
                echo
                fail=1
                ;;
            esac
          done
          exit "$fail"

      - name: Sync Edge Function secrets
        if: ${{ inputs.dry_run != true && env.ANTHROPIC_API_KEY != '' }}
        run: |
          npx --yes "$SUPABASE_CLI" secrets set \
            ANTHROPIC_API_KEY="$ANTHROPIC_API_KEY" --project-ref "$PROJECT_REF"
          if [ -n "$MODERATION_PROMPTS" ]; then
            npx --yes "$SUPABASE_CLI" secrets set \
              MODERATION_PROMPTS="$MODERATION_PROMPTS" --project-ref "$PROJECT_REF"
          else
            echo "::warning::MODERATION_PROMPTS repo secret is not set — the"\
              "moderation worker fails closed (queues hold) until it exists."
          fi
          if [ -n "$MODERATION_PROMPTS_BUSINESS" ]; then
            npx --yes "$SUPABASE_CLI" secrets set \
              MODERATION_PROMPTS_BUSINESS="$MODERATION_PROMPTS_BUSINESS" \
              --project-ref "$PROJECT_REF"
          fi

      # Separate from the Anthropic block above so a project with a support
      # inbox but no classifier key (or the other way round) still gets the
      # half it has configured.
      - name: Sync support mailer secrets
        if: ${{ inputs.dry_run != true && env.RESEND_API_KEY != '' && env.SUPPORT_INBOX != '' }}
        run: |
          npx --yes "$SUPABASE_CLI" secrets set \
            RESEND_API_KEY="$RESEND_API_KEY" \
            SUPPORT_INBOX="$SUPPORT_INBOX" --project-ref "$PROJECT_REF"
          if [ -n "$SUPPORT_FROM" ]; then
            npx --yes "$SUPABASE_CLI" secrets set \
              SUPPORT_FROM="$SUPPORT_FROM" --project-ref "$PROJECT_REF"
          fi

      - name: Migrations — after
        if: ${{ inputs.dry_run != true }}
        run: npx --yes "$SUPABASE_CLI" migration list --project-ref "$PROJECT_REF" -p "$DB_PASSWORD"

      - name: Troubleshooting hint
        if: failure()
        run: |
          echo "::error::Deploy failed. If the log above shows 401/Unauthorized or"
          echo "'Invalid access token', SUPABASE_ACCESS_TOKEN has expired — personal"
          echo "access tokens are time-limited. Generate a new one at"
          echo "https://supabase.com/dashboard/account/tokens and update the"
          echo "repository secret (Settings → Secrets and variables → Actions)."
          echo "Rotating it affects only this pipeline — never the running app."
