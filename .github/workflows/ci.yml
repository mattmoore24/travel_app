name: CI

on:
  push:
    branches: [main, 'claude/**']
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    name: Typecheck, lint, test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Lint
        run: npx expo lint -- --max-warnings 0

      - name: Format check
        run: npm run format:check

      - name: Test
        run: npm test

  db:
    name: Database RLS tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Postgres + pgTAP
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            postgresql-16 postgresql-16-pgtap libtap-parser-sourcehandler-pgtap-perl

      - name: Run migrations + pgTAP suite
        run: ./scripts/db-test.sh

  functions:
    # The Edge Functions are Deno, so tsconfig/jest deliberately exclude them —
    # which left the moderation and account-deletion code with no static check
    # at all. `deno check` type-checks them against their real remote imports.
    name: Edge Function typecheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x

      - name: Typecheck Edge Functions
        run: deno check supabase/functions/*/index.ts
