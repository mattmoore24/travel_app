# Builds a signed iOS binary and submits it to TestFlight. Exists because
# development happens from a phone: the GitHub runner is the keyboard, and
# either EAS or this runner is the Mac.
#
# Required repository secrets:
#   EXPO_TOKEN                     expo.dev access token
#   ASC_ISSUER_ID                  App Store Connect API -> Issuer ID (UUID)
#   ASC_KEY_ID                     App Store Connect API -> Key ID (~10 chars)
#   ASC_KEY_P8                     full contents of the AuthKey_XXXX.p8 file
#   APPLE_TEAM_ID                  10-char Apple team id (Membership tab)
#   EXPO_PUBLIC_SUPABASE_URL       for local builds, which cannot read EAS
#   EXPO_PUBLIC_SUPABASE_ANON_KEY  variables marked "Secret"
#
# THREE WAYS TO SHIP, cheapest first:
#
#   update      JavaScript only. Publishes to the channel the installed
#               TestFlight build already listens on. Free, unlimited, lands
#               on the next app launch. Use this for almost everything.
#
#   build-local Free, and currently BROKEN. Runs the identical EAS build
#               process on GitHub's macOS runner (`eas build --local`),
#               spending no EAS credit — but no Xcode on the macos-15 image
#               compiles Expo SDK 57. Kept as a fallback; re-test if the
#               subscription lapses or the runner image moves.
#
#   build       Native changes on EAS's hosted builders. THE WORKING PATH:
#               the local one cannot compile Expo SDK 57 on any Xcode the
#               macos-15 image carries (see .claude/skills/traps). Draws on
#               the paid plan's credit, so batch native changes rather than
#               building per commit.
#
# Two-step first flight, by necessity: the App Store Connect *app record*
# cannot be created until the bundle id exists, and the bundle id is
# registered by the first build's credential setup. So: run `build`, create
# the app record on appstoreconnect.apple.com, then run `submit`. Once the
# record exists, `build-then-submit` does both in one go.
name: TestFlight

on:
  workflow_dispatch:
    inputs:
      action:
        description: >-
          update = push JS to the build people already have (free, arrives on
          next app launch) — right for almost everything.
          build-then-submit = native changes, on EAS's hosted builders, which
          draw on the paid plan's credit. build-local* is free but currently
          cannot compile this SDK; see .claude/skills/traps.
        type: choice
        options: [update, build-local-then-submit, build-local, build, submit, build-then-submit]
        default: update
      xcode:
        description: >-
          Xcode version prefix for local builds. This project is pinned
          between two walls: expo-glass-effect needs the iOS 26 SDK (so not
          16.x), and expo-modules-jsi does not compile under 26.3's Swift
          (JavaScriptCodable+Date.swift, ambiguous expression). Sweep this if
          a build fails to compile Expo's own sources.
        type: string
        default: '26.1'

jobs:
  ios:
    # A local build needs a Mac; everything else is happier (and faster) on
    # Linux. Standard macOS runners are free and unlimited on a PUBLIC repo,
    # which is what makes the build-local path cost nothing.
    runs-on: ${{ startsWith(inputs.action, 'build-local') && 'macos-15' || 'ubuntu-latest' }}
    timeout-minutes: 150
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Check required secrets
        env:
          T: ${{ secrets.EXPO_TOKEN }}
          I: ${{ secrets.ASC_ISSUER_ID }}
          K: ${{ secrets.ASC_KEY_ID }}
          P: ${{ secrets.ASC_KEY_P8 }}
          A: ${{ secrets.APPLE_TEAM_ID }}
          SU: ${{ secrets.EXPO_PUBLIC_SUPABASE_URL }}
          SK: ${{ secrets.EXPO_PUBLIC_SUPABASE_ANON_KEY }}
          PH: ${{ secrets.EXPO_PUBLIC_POSTHOG_API_KEY }}
        run: |
          missing=()
          [ -n "$T" ] || missing+=(EXPO_TOKEN)
          # The bundler inlines these, so an update without them ships an app
          # pointed at nothing. Required for every action: a build reads them
          # from EAS's own environment, but the check costs nothing and the
          # failure is silent either way.
          [ -n "$SU" ] || missing+=(EXPO_PUBLIC_SUPABASE_URL)
          [ -n "$SK" ] || missing+=(EXPO_PUBLIC_SUPABASE_ANON_KEY)
          # Analytics is the same shape of silent failure: without the key
          # every capture() is a no-op, four of the six §6 metrics have no
          # source, and the launch window cannot be evaluated retrospectively.
          # Failing here is the loud version the Supabase pair already gets.
          [ -n "$PH" ] || missing+=(EXPO_PUBLIC_POSTHOG_API_KEY)
          # Signing secrets only matter when an actual build or submit runs.
          if [ "${{ inputs.action }}" != "update" ]; then
            [ -n "$I" ] || missing+=(ASC_ISSUER_ID)
            [ -n "$K" ] || missing+=(ASC_KEY_ID)
            [ -n "$P" ] || missing+=(ASC_KEY_P8)
            [ -n "$A" ] || missing+=(APPLE_TEAM_ID)
          fi
          if [ ${#missing[@]} -gt 0 ]; then
            echo "::error::Missing repository secrets: ${missing[*]}"
            exit 1
          fi

      - name: Install
        run: npm ci

      # JS-only change: no EAS build, no App Store processing, no waiting for
      # a tester to install anything. The runtime version comes from the app
      # version (app.json), so this only ever reaches builds that can run it,
      # and a native change still needs a real build.
      - name: Publish an over-the-air update
        if: ${{ inputs.action == 'update' }}
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
          EXPO_NO_TELEMETRY: '1'
          # Metro inlines EXPO_PUBLIC_* at bundle time, and this bundling
          # happens HERE, on this runner. A build gets these from the EAS
          # environment named in eas.json; an update gets nothing unless it is
          # handed them, and src/lib/supabase falls back to
          # placeholder.supabase.co when they are missing. So every update
          # published from this step before now shipped an app pointed at a
          # host that does not exist, and every tester's app would have gone
          # dead on its next launch. expo-go-publish.yml has always passed
          # them; this step never did.
          EXPO_PUBLIC_SUPABASE_URL: ${{ secrets.EXPO_PUBLIC_SUPABASE_URL }}
          EXPO_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.EXPO_PUBLIC_SUPABASE_ANON_KEY }}
          # Same reasoning as the pair above, and the same failure mode. A BUILD
          # gets these from the EAS environment named in eas.json; an UPDATE gets
          # only what this step hands it. src/lib/analytics.ts is
          # `const client = apiKey ? new PostHog(...) : null`, so without the key
          # every capture() in the app is a silent no-op and four of the six §6
          # metrics have no source at all. Adding the key to the EAS environment
          # alone fixes builds and then the next update strips it back out.
          EXPO_PUBLIC_POSTHOG_API_KEY: ${{ secrets.EXPO_PUBLIC_POSTHOG_API_KEY }}
          EXPO_PUBLIC_POSTHOG_HOST: ${{ secrets.EXPO_PUBLIC_POSTHOG_HOST }}
        run: |
          set -o pipefail
          # The key's presence is enforced by 'Check required secrets' above,
          # which fails the run before anything is bundled — an update
          # published without it ships analytics dead even when the binary
          # underneath had a key baked in, and that cannot be un-sent.

          # Prove the bundle before it goes anywhere. A build is verified
          # below and an update was not, which is backwards: an update reaches
          # every tester at once, on their next launch, and cannot be
          # un-sent. --no-bytecode so the strings are greppable.
          rm -rf ota-proof
          npx --yes expo export --platform ios --no-bytecode --output-dir ota-proof
          REAL=$(grep -rhoaE 'https://[a-z0-9-]+\.supabase\.co' ota-proof 2>/dev/null |
            grep -v placeholder | sort -u | wc -l | tr -d ' ')
          if [ "$REAL" = "0" ]; then
            echo "::error::The bundle carries no real Supabase URL, only the"
            echo "::error::placeholder fallback. Publishing this would point every"
            echo "::error::tester's app at nothing. Check the EXPO_PUBLIC_SUPABASE_*"
            echo "::error::repository secrets."
            exit 1
          fi
          echo "Real Supabase host in the bundle ($REAL distinct)."

          # Bounded as a safety net, not because of an observed hang. I
          # cancelled run 18 believing it had sat here for 37 minutes; the
          # clock says it had been running about three, and run 19 published
          # in 2m40s. The miscount was mine. The cap stays anyway — this step
          # holds a 150-minute job and would otherwise fail silently by never
          # finishing — but ten minutes is chosen as headroom over a normal
          # publish, not as a line something has actually crossed.
          # `|| status=$?` and not a bare call: the step runs under `bash -e`,
          # which would exit on the failing pipeline before the status could
          # be read, and 124 is the whole point.
          status=0
          timeout 600 npx --yes eas-cli@latest update \
            --branch production \
            --message "${{ github.event.head_commit.message || github.sha }}" \
            --non-interactive 2>&1 | tee update.log || status=$?
          if [ "$status" -eq 124 ]; then
            echo "::error::eas update did not finish in 10 minutes. Nothing was"
            echo "::error::published. Re-run; if it hangs again, check status.expo.dev."
            exit 1
          fi
          [ "$status" -eq 0 ] || exit "$status"
          {
            echo "## Over-the-air update published"
            echo "Testers get it the next time they open the app (close it fully first)."
            grep -oE 'https://expo\.dev/[^ ]*updates/[^ ]+' update.log | head -1 || true
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Write the ASC key
        if: ${{ inputs.action != 'update' }}
        env:
          ASC_KEY_P8: ${{ secrets.ASC_KEY_P8 }}
        run: |
          umask 077
          printf '%s\n' "$ASC_KEY_P8" > "$RUNNER_TEMP/asc.p8"

      # eas-cli cannot CREATE iOS credentials non-interactively (its
      # non-interactive path only reuses ones already on Expo's servers — a
      # literal TODO in SetUpDistributionCertificate.js). So this does what
      # fastlane does: mint the cert and App Store profile via the ASC API
      # and hand them to the build as local credentials.
      - name: Mint signing credentials via the ASC API
        if: ${{ inputs.action != 'submit' && inputs.action != 'update' }}
        env:
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
        run: |
          set -o pipefail
          npm install --no-save jsonwebtoken
          # This step now runs on Linux OR macOS, and they ship different TLS
          # tools: macOS's `openssl` is LibreSSL, which has no -legacy flag
          # because it already writes the old p12 format. Prefer a real
          # OpenSSL 3 when one is installed, and only pass -legacy to that.
          SSL="$(command -v openssl)"
          for cand in /opt/homebrew/opt/openssl@3/bin/openssl /usr/local/opt/openssl@3/bin/openssl; do
            if [ -x "$cand" ]; then SSL="$cand"; break; fi
          done
          LEGACY=""
          "$SSL" version | grep -qi libressl || LEGACY="-legacy"
          echo "Using $("$SSL" version) ${LEGACY:-(no -legacy flag)}"
          "$SSL" genrsa -out "$RUNNER_TEMP/dist.key" 2048
          "$SSL" req -new -key "$RUNNER_TEMP/dist.key" \
            -out "$RUNNER_TEMP/dist.csr" -subj "/CN=Samewhere Distribution/OU=CI"
          export ASC_KEY_PATH="$RUNNER_TEMP/asc.p8"
          export CSR_PATH="$RUNNER_TEMP/dist.csr"
          export CERT_DER_OUT="$RUNNER_TEMP/dist.der"
          export PROFILE_OUT="$RUNNER_TEMP/profile.mobileprovision"
          export BUNDLE_ID=$(node -p "require('./app.json').expo.ios.bundleIdentifier")
          export APP_NAME=$(node -p "require('./app.json').expo.name")
          node scripts/asc-provision.mjs
          "$SSL" x509 -inform der -in "$RUNNER_TEMP/dist.der" -out "$RUNNER_TEMP/dist.pem"
          P12_PASSWORD=$("$SSL" rand -hex 16)
          echo "::add-mask::$P12_PASSWORD"
          # macOS's `security import` rejects OpenSSL 3's default PBES2/SHA-256
          # p12 encryption; the legacy format imports cleanly and still parses
          # with @expo/pkcs12 (verified locally against both formats).
          "$SSL" pkcs12 -export $LEGACY -out "$RUNNER_TEMP/dist.p12" \
            -inkey "$RUNNER_TEMP/dist.key" -in "$RUNNER_TEMP/dist.pem" \
            -passout "pass:$P12_PASSWORD"
          P12_PASSWORD="$P12_PASSWORD" node -e "
            const fs = require('fs');
            fs.writeFileSync('credentials.json', JSON.stringify({
              ios: {
                provisioningProfilePath: process.env.RUNNER_TEMP + '/profile.mobileprovision',
                distributionCertificate: {
                  path: process.env.RUNNER_TEMP + '/dist.p12',
                  password: process.env.P12_PASSWORD,
                },
              },
            }, null, 2));
          "

      # BEFORE the builder runs, because after it the credit is gone.
      #
      # A hosted build reads EXPO_PUBLIC_* from the EAS `production`
      # environment (eas.json), NOT from the GitHub secrets the preflight
      # checks - those reach the over-the-air path only. So the .ipa's
      # analytics key and Supabase host are decided by state that lives on
      # Expo's servers and in no file here, and the checks that prove them
      # sit after the build. A missing variable would mean: builder runs,
      # credit spent, verification fails, nothing submitted.
      #
      # This asks the same question first, for the price of an API call.
      - name: The EAS environment has what the binary needs
        if: ${{ inputs.action == 'build' || inputs.action == 'build-then-submit' }}
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
          EXPO_NO_TELEMETRY: '1'
        run: |
          set -o pipefail
          npx --yes eas-cli@latest env:list --environment production --non-interactive \
            > eas-env.txt 2>&1 || {
              echo "::error::Could not read the EAS production environment. Without it this"
              echo "::error::run would spend a build and only then discover what is missing."
              cat eas-env.txt
              exit 1
            }
          missing=()
          for key in EXPO_PUBLIC_SUPABASE_URL EXPO_PUBLIC_SUPABASE_ANON_KEY \
                     EXPO_PUBLIC_POSTHOG_API_KEY EXPO_PUBLIC_POSTHOG_HOST; do
            grep -q "$key" eas-env.txt || missing+=("$key")
          done
          if [ ${#missing[@]} -gt 0 ]; then
            echo "::error::The EAS production environment is missing: ${missing[*]}"
            echo "::error::A hosted build inlines these at bundle time, so the binary would"
            echo "::error::ship pointed at nothing (Supabase) or silently discarding every"
            echo "::error::analytics call (PostHog). Add them with:"
            echo "::error::  eas env:create --environment production --name <KEY> --value <value>"
            echo "::error::No builder has run, so this attempt consumed nothing."
            exit 1
          fi
          echo "The EAS production environment carries all four EXPO_PUBLIC_ values."

      - name: Build on EAS
        if: ${{ inputs.action == 'build' || inputs.action == 'build-then-submit' }}
        id: eas-build
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
          EXPO_NO_TELEMETRY: '1'
        run: |
          set -o pipefail
          # eas-cli floats on @latest on purpose (a pin rots in the other
          # direction), so the version that ran is written down where the run
          # can be read, and every field this job depends on is asserted
          # below rather than assumed. The flags here were checked against
          # eas-cli 23.2.0 on 2026-09-01: build --platform --profile
          # --non-interactive --wait --json; submit --platform --profile
          # --id --latest --path --non-interactive.
          echo "eas-cli $(npx --yes eas-cli@latest --version 2>/dev/null | tail -1)"
          # --json puts the finished build's own record on stdout and every
          # human line on stderr, which is kept in build.log for the quota
          # message below. The record is the only honest source for the build
          # number: the remote counter increments when a build is REQUESTED,
          # including for attempts that are then refused, so a number is
          # never promised before a build starts and always read back from
          # the one that finished.
          status=0
          npx --yes eas-cli@latest build \
            --platform ios \
            --profile production \
            --non-interactive \
            --wait --json > build.json 2> >(tee build.log >&2) || status=$?
          # Let the tee behind the process substitution finish writing.
          sleep 2
          if [ "$status" -ne 0 ]; then
            # EAS refuses the job at queue time once the month's iOS builds
            # are spent and reports it as a generic "build command failed",
            # which reads like a compile error. Name it instead, so nobody
            # goes looking for a bug that isn't there or re-dispatches into
            # the same wall.
            if grep -q 'has used its iOS builds' build.log; then
              RESET=$(grep -oE 'will reset in [^.]*' build.log | head -1)
              echo "::error::EAS iOS build quota is spent for this month ($RESET). No builder ran, so this attempt consumed nothing. Ship JavaScript with action=update meanwhile, or upgrade the plan at https://expo.dev/accounts/mattmoore24s-team/settings/billing"
            fi
            exit "$status"
          fi
          node - <<'EOF'
          const fs = require('fs');
          const raw = fs.readFileSync('build.json', 'utf8');
          const parsed = JSON.parse(raw.slice(raw.search(/[\[{]/)));
          const build = Array.isArray(parsed) ? parsed[0] : parsed;
          const missing = [];
          if (!build?.id) missing.push('id');
          if (build?.status !== 'FINISHED') missing.push(`status FINISHED (got ${build?.status})`);
          if (!build?.appBuildVersion) missing.push('appBuildVersion');
          const ipa = build?.artifacts?.applicationArchiveUrl || build?.artifacts?.buildUrl;
          if (!ipa) missing.push('artifacts.applicationArchiveUrl');
          if (missing.length) {
            console.error(`::error::eas build --json did not answer with ${missing.join(', ')}. The build may have finished; nothing below can read it back, so this run stops here rather than submitting or verifying a guess. First 600 chars of build.json: ${raw.slice(0, 600)}`);
            process.exit(1);
          }
          const app = JSON.parse(fs.readFileSync('app.json', 'utf8')).expo;
          const page = `https://expo.dev/accounts/${app.owner}/projects/${app.slug}/builds/${build.id}`;
          fs.appendFileSync(process.env.GITHUB_OUTPUT, [
            `build-id=${build.id}`,
            `build-number=${build.appBuildVersion}`,
            `ipa-url=${ipa}`,
            '',
          ].join('\n'));
          fs.appendFileSync(process.env.GITHUB_STEP_SUMMARY, [
            '## iOS build finished',
            '',
            `- EAS build id: \`${build.id}\``,
            `- Build number (CFBundleVersion), read back from the finished build: **${build.appBuildVersion}**`,
            `- Version ${build.appVersion} (runtime version ${build.runtimeVersion ?? build.runtime?.version ?? 'unknown'})`,
            `- ${page}`,
            '',
          ].join('\n'));
          console.log(`Build ${build.id} finished as build number ${build.appBuildVersion} (${build.appVersion}).`);
          EOF

      # The free path. `eas build --local` runs the identical build process on
      # THIS runner instead of EAS's builders, so it draws on no monthly build
      # allowance — Expo's servers are contacted only to check the project
      # exists and to bump the remote build number. Standard macOS runners are
      # free and unlimited on a public repository, which is what makes this
      # cost nothing at all.
      # /Applications/Xcode.app on GitHub's macOS image is NOT the newest one
      # installed — on macos-15 it is 16.4, whose iOS 18.5 SDK cannot compile
      # expo-glass-effect's iOS 26 APIs. The image also carries Xcode 26.x, so
      # pick the highest version explicitly and refuse to build on a toolchain
      # that would fail thirty minutes later.
      - name: Pick an Xcode
        if: ${{ startsWith(inputs.action, 'build-local') }}
        run: |
          set -eu
          ls -d /Applications/Xcode*.app
          # Newest is NOT the answer here, and neither is the default symlink.
          # The project sits between two walls: expo-glass-effect needs the
          # iOS 26 SDK, and expo-modules-jsi fails to compile under 26.3's
          # Swift. So the version is an explicit input, swept when Expo's own
          # sources stop compiling.
          WANT="${{ inputs.xcode }}"
          PICK=$(ls -d /Applications/Xcode_${WANT}*.app 2>/dev/null |
            sed 's#.*/Xcode_##; s#\.app$##' | sort -V | tail -1)
          if [ -z "$PICK" ]; then
            echo "::error::No Xcode matching '${WANT}' on this runner. Installed: $(ls -d /Applications/Xcode_*.app | sed 's#.*/Xcode_##; s#\.app$##' | tr '\n' ' ')"
            exit 1
          fi
          DEV="/Applications/Xcode_${PICK}.app/Contents/Developer"
          sudo xcode-select -s "$DEV"
          # gym reads DEVELOPER_DIR ahead of the xcode-select symlink, so set
          # both rather than trusting one.
          echo "DEVELOPER_DIR=$DEV" >> "$GITHUB_ENV"
          xcodebuild -version
          SDK=$(xcrun --sdk iphoneos --show-sdk-version)
          echo "iOS SDK $SDK"
          if [ "${SDK%%.*}" -lt 26 ]; then
            echo "::error::iOS SDK $SDK is too old. expo-glass-effect compiles against iOS 26 APIs, so this build would fail in the archive phase."
            exit 1
          fi
          pod --version
          fastlane --version | tail -1

      - name: Build on this runner
        if: ${{ startsWith(inputs.action, 'build-local') }}
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
          EXPO_NO_TELEMETRY: '1'
          # Local builds cannot read EAS variables marked "Secret", and a build
          # that bakes an empty Supabase URL into the bundle ships a working
          # app pointed at nothing. Supplying them from repository secrets as
          # well means the value is present either way; the check below proves
          # which one landed.
          EXPO_PUBLIC_SUPABASE_URL: ${{ secrets.EXPO_PUBLIC_SUPABASE_URL }}
          EXPO_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.EXPO_PUBLIC_SUPABASE_ANON_KEY }}
          # Keep the generated Xcode project around so the next step can read
          # which native modules autolinking actually wired in.
          EAS_LOCAL_BUILD_SKIP_CLEANUP: '1'
          EAS_LOCAL_BUILD_WORKINGDIR: ${{ runner.temp }}/eas-local
        run: |
          set -o pipefail
          npx --yes eas-cli@latest build \
            --platform ios \
            --profile production \
            --local \
            --non-interactive \
            --output "$RUNNER_TEMP/samewhere.ipa" 2>&1 | tee build.log

      # A build that succeeds and ships nothing new is the expensive failure
      # here: it looks identical to a good one until somebody taps the feature
      # on a real phone. Prove the four things that could silently be missing:
      # the two native modules, the Supabase host, the PostHog key.
      - name: Prove the binary carries what it should
        if: ${{ contains(inputs.action, 'build') }}
        run: |
          # Deliberately no pipefail: several checks below end in `wc -l` after
          # a grep that is ALLOWED to match nothing, and pipefail would abort
          # on the grep before the readable error message is printed.
          set -eu
          # The local path leaves the .ipa on disk. A hosted build leaves it
          # on Expo's CDN, and it needs checking just as much — this step
          # used to skip hosted builds entirely, which meant the one build
          # that actually shipped was the one nobody verified.
          IPA="$RUNNER_TEMP/samewhere.ipa"
          if [ ! -f "$IPA" ]; then
            # The finished build's own record names the artifact; the log
            # grep is the fallback for a run whose JSON could not be read.
            URL="${{ steps.eas-build.outputs.ipa-url }}"
            if [ -z "$URL" ]; then
              URL=$(grep -oE 'https://expo\.dev/artifacts/eas/[^ ]+\.ipa' build.log 2>/dev/null | head -1 || true)
            fi
            if [ -z "$URL" ]; then
              echo "::error::No local .ipa and no artifact URL from the build; nothing to verify."
              exit 1
            fi
            echo "Downloading the hosted artifact to verify it."
            curl -fsSL -o "$IPA" "$URL"
          fi
          ls -lh "$IPA"

          WORK="$RUNNER_TEMP/verify"
          rm -rf "$WORK" && mkdir -p "$WORK"
          unzip -q "$IPA" -d "$WORK"
          APP=$(find "$WORK/Payload" -maxdepth 1 -name '*.app' | head -1)

          # 1. Autolinking wired the local native module in. The generated
          #    provider is the file the app registers its modules from, so it
          #    is the authoritative answer; the compiled bundle is the backup
          #    if the build cleaned its working directory up anyway.
          # Only the local path keeps a working directory, so a hosted build
          # falls through to the compiled-strings check below. That is the
          # weaker of the two, but it reads the binary that actually ships.
          #    The strings fallback reads the NATIVE files only. The JS bundle
          #    in the .app carries `requireNativeModule('ExpoStoreReview')` and
          #    `requireOptionalNativeModule('LocalSearch')` whether or not the
          #    pod linked, so a grep over the whole .app would answer yes for
          #    a binary with neither module in it. What the native side keeps
          #    is the Swift type name (`StoreReviewModule`, `LocalSearchModule`)
          #    in its type descriptors, which stripping does not remove.
          PROVIDER=$(find "$RUNNER_TEMP/eas-local" -name 'ExpoModulesProvider.swift' 2>/dev/null | head -1)
          # Two spellings, either of which proves the pod linked. The Swift
          # TYPE name rides in the nominal type descriptors; the Name() string
          # literal rides in __TEXT,__cstring. The type name is the stronger
          # signal and the literal is the one that cannot be stripped, and
          # this has never run against a hosted .ipa, so it accepts both
          # rather than failing a good build on an assumption about metadata.
          native_strings() {
            grep -rlE --exclude='*.jsbundle' --exclude='*.js' --exclude='*.map' --exclude='*.json' \
              "$1" "$APP" 2>/dev/null | wc -l | tr -d ' '
          }
          if [ -n "$PROVIDER" ]; then
            echo "Modules registered by $PROVIDER:"
            grep -oE '[A-Za-z0-9_]+Module\.self' "$PROVIDER" | sort -u
            LINKED=$(grep -c 'LocalSearchModule' "$PROVIDER" || true)
            HOW="the generated ExpoModulesProvider"
          else
            LINKED=$(native_strings 'LocalSearchModule|Name\("LocalSearch"\)')
            HOW="strings in the compiled app, JS bundle excluded"
          fi
          if [ "$LINKED" = "0" ]; then
            echo "::error::LocalSearchModule is absent according to $HOW. The pod did not link and venue search would ship dead. Run 'npx expo-modules-autolinking resolve -p apple --json' and check modules[].packageName."
            exit 1
          fi
          echo "LocalSearchModule linked, per $HOW."

          # 1b. expo-store-review, the module the 0.2.0 build is spent on. It
          #     is the one check here a phone cannot make: on TestFlight
          #     isAvailableAsync answers false BY DESIGN
          #     (StoreReviewModule.swift, !isRunningFromTestFlight), so the
          #     hand-run's `review_prompt_requested { available: false }` is
          #     byte-identical for a linked module and an absent one. This is
          #     the only place the difference is visible before the App Store
          #     build. The Swift class is StoreReviewModule (Name("ExpoStoreReview")).
          if [ -n "$PROVIDER" ]; then
            REVIEW=$(grep -c 'StoreReviewModule' "$PROVIDER" || true)
          else
            REVIEW=$(native_strings 'StoreReviewModule|Name\("ExpoStoreReview"\)')
          fi
          if [ "$REVIEW" = "0" ]; then
            echo "::error::StoreReviewModule is absent according to $HOW. expo-store-review did not link, and the review ask would ship as a module that throws on require (the hook contains it, so nothing crashes and nothing ever asks). Check that expo-store-review is in package.json dependencies and that 'npx expo-modules-autolinking resolve -p apple --json' lists it."
            exit 1
          fi
          echo "StoreReviewModule linked, per $HOW."

          # 2. A real Supabase URL is baked in. The client falls back to
          #    'placeholder.supabase.co' when the variable is empty, so a
          #    supabase host on its own proves nothing.
          REAL=$(grep -rhoaE 'https://[a-z0-9-]+\.supabase\.co' "$APP" 2>/dev/null |
            grep -v placeholder | sort -u | wc -l | tr -d ' ')
          if [ "$REAL" = "0" ]; then
            echo "::error::The bundle carries no real Supabase URL, only the placeholder fallback: this build would launch against nothing. Check the EXPO_PUBLIC_SUPABASE_* repository secrets."
            exit 1
          fi
          echo "Real Supabase host baked in ($REAL distinct)."

          # 2b. The PostHog project key is baked in. src/lib/analytics.ts is
          #     `const client = apiKey ? new PostHog(...) : null`, so a bundle
          #     built from an EAS environment without EXPO_PUBLIC_POSTHOG_API_KEY
          #     ships every capture() as a silent no-op: the app runs, nothing
          #     is red, and the launch window cannot be measured afterwards.
          #     The preflight above checks the REPOSITORY secret, which only an
          #     update bundles from; a build bundles from the EAS environment,
          #     and this is the only check that reads what the build got. A
          #     project key is `phc_` and 40-odd base62 characters; the
          #     library's own code contains no `phc_` string, so a match this
          #     long can only be a key.
          PH_KEYS=$(grep -rhoaE 'phc_[A-Za-z0-9]{20,}' "$APP" 2>/dev/null | sort -u | wc -l | tr -d ' ')
          if [ "$PH_KEYS" = "0" ]; then
            echo "::error::No PostHog project key in the bundle: this build would ship analytics dead. Add EXPO_PUBLIC_POSTHOG_API_KEY (and EXPO_PUBLIC_POSTHOG_HOST) to the EAS environment eas.json names, then rebuild."
            exit 1
          fi
          echo "PostHog project key baked in ($PH_KEYS distinct)."

          # 3. The APNs entitlement is `production`. This is the check
          #    docs/APP_STORE.md ("The APNs entitlement") says closes the
          #    notification config out, and the one whose wrong value is
          #    silent: a binary carrying `aps-environment: development`
          #    registers against the APNs sandbox, gets a token that looks
          #    fine, and never receives a push. There is no codesign on this
          #    runner, so it is read from the two places the value lives in
          #    the .ipa itself: the provisioning profile (a CMS envelope
          #    around an XML plist; openssl opens it, plistlib reads it) and
          #    the executable's own code signature, where codesign embeds
          #    the signed entitlements plist verbatim. Both must agree on
          #    `production`; a run with neither readable fails rather than
          #    guessing. CFBundleVersion is read off the same Info.plist, so
          #    the build number in the summary is the artifact's own.
          python3 - "$APP" <<'EOF'
          import os, plistlib, re, subprocess, sys

          app = sys.argv[1]
          want = 'production'
          answers = {}

          # Two independent sources, and the whole point is that either one
          # can answer. So this must NOT raise: check=True on the openssl call
          # (or a CMS shape plistlib will not parse) would kill the step
          # before the code signature - the fallback that exists for exactly
          # this - had been read. A run with NEITHER readable still fails
          # below; a run where openssl hiccups falls through to the binary.
          answers['profile'] = None
          profile = os.path.join(app, 'embedded.mobileprovision')
          if os.path.exists(profile):
              try:
                  plist = subprocess.run(
                      ['openssl', 'smime', '-verify', '-noverify', '-inform', 'der', '-in', profile],
                      capture_output=True, check=False,
                  ).stdout
                  answers['profile'] = plistlib.loads(plist).get('Entitlements', {}).get('aps-environment')
              except Exception as err:  # noqa: BLE001 - any failure is "unreadable"
                  print(f"could not read the provisioning profile ({err}); falling back to the binary")

          info = plistlib.load(open(os.path.join(app, 'Info.plist'), 'rb'))
          exe = open(os.path.join(app, info['CFBundleExecutable']), 'rb').read()
          found = re.search(rb'<key>aps-environment</key>\s*<string>([^<]*)</string>', exe)
          answers['binary'] = found.group(1).decode() if found else None

          for key, value in answers.items():
              print(f"aps-environment per {key}: {value if value is not None else '(not found)'}")
          print(f"CFBundleShortVersionString {info.get('CFBundleShortVersionString')}, CFBundleVersion {info.get('CFBundleVersion')}")

          readable = {k: v for k, v in answers.items() if v is not None}
          if not readable:
              print('::error::aps-environment could not be read from the profile or the binary. Nothing here says which APNs this build registers against; run codesign -d --entitlements :- on the .ipa by hand before trusting push.')
              sys.exit(1)
          wrong = {k: v for k, v in readable.items() if v != want}
          if wrong:
              print(f"::error::aps-environment is not {want}: {wrong}. This build would register against the APNs sandbox and never receive a push. app.json passes mode: production to expo-notifications; find what overrode it before spending another build.")
              sys.exit(1)

          with open(os.environ['GITHUB_STEP_SUMMARY'], 'a') as summary:
              summary.write('## Binary verified\n\n')
              summary.write('- LocalSearchModule linked: yes\n')
              summary.write('- StoreReviewModule (expo-store-review) linked: yes\n')
              summary.write('- Real Supabase host in the bundle: yes\n')
              summary.write('- PostHog project key in the bundle: yes\n')
              summary.write(f"- aps-environment: **{want}** (profile: {answers['profile'] or 'not present'}, binary: {answers['binary'] or 'not found'})\n")
              summary.write(f"- The artifact's own Info.plist: version {info.get('CFBundleShortVersionString')}, build number {info.get('CFBundleVersion')}\n")
          EOF

      - name: Submit to TestFlight
        if: ${{ inputs.action == 'submit' || endsWith(inputs.action, 'then-submit') }}
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          EXPO_NO_TELEMETRY: '1'
        run: |
          set -o pipefail
          npm install --no-save jsonwebtoken

          # Resolve the App Store Connect numeric app id from the bundle id.
          # eas submit --non-interactive refuses to guess it, and it only
          # exists once the founder has created the app record.
          node - <<'EOF'
          const fs = require('fs');
          const jwt = require('jsonwebtoken');
          const bundleId = JSON.parse(fs.readFileSync('app.json', 'utf8')).expo.ios.bundleIdentifier;
          const token = jwt.sign(
            { iss: process.env.ASC_ISSUER_ID, aud: 'appstoreconnect-v1' },
            fs.readFileSync(process.env.RUNNER_TEMP + '/asc.p8', 'utf8'),
            { algorithm: 'ES256', expiresIn: '10m', keyid: process.env.ASC_KEY_ID }
          );
          fetch(`https://api.appstoreconnect.apple.com/v1/apps?filter[bundleId]=${bundleId}`, {
            headers: { Authorization: `Bearer ${token}` },
          })
            .then(async (r) => {
              const body = await r.json();
              if (!r.ok) throw new Error(`ASC API ${r.status}: ${JSON.stringify(body).slice(0, 400)}`);
              const app = body.data?.[0];
              if (!app) {
                console.error(
                  `::error::No App Store Connect app record for ${bundleId}. ` +
                  'Create it first: appstoreconnect.apple.com -> My Apps -> + -> New App ' +
                  `(iOS, name "Samewhere", bundle id ${bundleId}, SKU samewhere), then re-run with action=submit.`
                );
                process.exit(1);
              }
              const eas = JSON.parse(fs.readFileSync('eas.json', 'utf8'));
              eas.submit.production.ios = {
                ascApiKeyPath: process.env.RUNNER_TEMP + '/asc.p8',
                ascApiKeyId: process.env.ASC_KEY_ID,
                ascApiKeyIssuerId: process.env.ASC_ISSUER_ID,
                ascAppId: app.id,
                appleTeamId: process.env.APPLE_TEAM_ID,
              };
              fs.writeFileSync('eas.json', JSON.stringify(eas, null, 2) + '\n');
              console.log(`Resolved ${bundleId} -> ascAppId ${app.id}`);
            })
            .catch((e) => { console.error('::error::' + e.message); process.exit(1); });
          EOF

          # A local build is never registered on EAS's servers, so --latest
          # would happily upload the last CLOUD build instead — an older
          # binary, submitted silently and looking like a success. Point
          # submit at the file when there is one, at the build THIS RUN made
          # when it was hosted (by id, read back from the finished build), and
          # only at --latest for a bare `submit` with no build of its own.
          if [ -f "$RUNNER_TEMP/samewhere.ipa" ]; then
            SOURCE=(--path "$RUNNER_TEMP/samewhere.ipa")
            echo "Submitting the binary built on this runner."
          elif [ -n "${{ steps.eas-build.outputs.build-id }}" ]; then
            SOURCE=(--id "${{ steps.eas-build.outputs.build-id }}")
            echo "Submitting build ${{ steps.eas-build.outputs.build-id }} (build number ${{ steps.eas-build.outputs.build-number }})."
          else
            SOURCE=(--latest)
            echo "Submitting the latest store build from EAS."
          fi
          npx --yes eas-cli@latest submit \
            --platform ios \
            --profile production \
            "${SOURCE[@]}" \
            --non-interactive 2>&1 | tee submit.log
          {
            echo "## Submitted to TestFlight"
            if [ -n "${{ steps.eas-build.outputs.build-number }}" ]; then
              echo "Build number ${{ steps.eas-build.outputs.build-number }} (EAS build ${{ steps.eas-build.outputs.build-id }})."
            fi
            echo "Apple processes the build for ~5-15 minutes, then it appears"
            echo "in the TestFlight tab of App Store Connect."
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Logs on failure
        if: failure()
        run: |
          tail -60 build.log 2>/dev/null || true
          tail -60 submit.log 2>/dev/null || true
          # xcbeautify formats the archive output and drops the stderr of any
          # script phase that fails, so the reason never reaches this log —
          # Expo then prints its own guess, which has already been wrong once.
          # The raw Xcode logs survive in the kept working directory.
          DIR="$RUNNER_TEMP/eas-local"
          if [ -d "$DIR" ]; then
            echo "===== raw Xcode logs under $DIR ====="
            find "$DIR" -name '*.log' -newermt '-2 hours' 2>/dev/null | head -20
            find "$DIR" -name '*.log' 2>/dev/null | while read -r f; do
              if grep -qE '(^|[^A-Za-z])error:|error: |failed with a nonzero exit' "$f" 2>/dev/null; then
                echo "----- $f"
                grep -nE '(^|[^A-Za-z])error:|error: |failed with a nonzero exit|Could not resolve|No space left' "$f" \
                  | head -40
              fi
            done
            echo "===== ExpoModulesJSI script phase context ====="
            grep -rn -A25 'Build ExpoModulesJSI xcframework' "$DIR" --include='*.log' 2>/dev/null |
              head -80
          fi
