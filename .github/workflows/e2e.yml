# Runs the real native app in an iOS Simulator and screenshots every step of
# the Maestro flows in e2e/flows/. Results are force-pushed to the
# `e2e-results` branch because workflow artifacts cannot be downloaded from
# the development sandbox, but a git branch can.
#
# Split into two jobs so the 10x-billed macOS runner never sits waiting on an
# EAS build queue.
name: E2E simulator

on:
  workflow_dispatch:
    inputs:
      build:
        description: >-
          Build a fresh simulator app, so the binary EMBEDS the code under
          test. Leave this OFF for a JavaScript-only change. This used to say
          the over-the-air path did not work here, on the evidence of a step
          that failed 0.1s after launching the app — before it had waited for
          anything — because `DB=$(ls ... | tail -1)` under `bash -e` with
          pipefail takes the whole step down the first time the file is
          missing, which is the case the loop exists to wait out. With that
          fixed, run 43 fetched the update and drove the flows against it. A
          build costs real EAS credit; only native changes need one.
        type: boolean
        default: false

jobs:
  app:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    outputs:
      url: ${{ steps.resolve.outputs.url }}
      update-id: ${{ steps.update.outputs.id }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
      - name: Install
        run: npm ci
      - name: Build or reuse the simulator app
        id: resolve
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
          EXPO_NO_TELEMETRY: '1'
        run: |
          set -o pipefail
          if [ "${{ inputs.build }}" = "true" ]; then
            npx --yes eas-cli@latest build --platform ios --profile simulator \
              --non-interactive --wait --json > build.json
          else
            npx --yes eas-cli@latest build:list --platform ios --status finished \
              --build-profile simulator --limit 1 --json --non-interactive > build.json
          fi
          URL=$(node -p "
            const b = JSON.parse(require('fs').readFileSync('build.json','utf8'));
            (Array.isArray(b) ? b[0] : b)?.artifacts?.buildUrl ?? ''
          ")
          if [ -z "$URL" ]; then
            echo "::error::No finished simulator build found. Re-run with build=true."
            exit 1
          fi
          echo "url=$URL" >> "$GITHUB_OUTPUT"

      # Reusing a binary means reusing its JavaScript too, which would test
      # the wrong code. Publishing to the channel it listens on ('e2e') keeps
      # the run honest without spending an iOS build.
      #
      # The id is carried to the next job and asserted there. A warning used
      # to be enough here; it was not. A run that quietly kept the binary's
      # own JS still produced twenty confident screenshots of the wrong code.
      - name: Push current JS to the reused build
        id: update
        if: ${{ inputs.build != true }}
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
          EXPO_NO_TELEMETRY: '1'
          # INLINED AT BUNDLE TIME, so they have to be here and not only in
          # the job that drives the simulator. Without them the update
          # published fine, downloaded fine, launched fine — and the app came
          # up on "waiting on backend keys", because isSupabaseConfigured was
          # false in the bundle. Run 43 photographed an empty map and died on
          # a Drop a pin button that a keyless app never renders. A build does
          # not show this: the EAS build reads the same secrets from the
          # project, so the embedded JS is always configured.
          EXPO_PUBLIC_SUPABASE_URL: ${{ secrets.EXPO_PUBLIC_SUPABASE_URL }}
          EXPO_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.EXPO_PUBLIC_SUPABASE_ANON_KEY }}
        run: |
          set -o pipefail
          if [ -z "${EXPO_PUBLIC_SUPABASE_URL:-}" ] || [ -z "${EXPO_PUBLIC_SUPABASE_ANON_KEY:-}" ]; then
            echo "::error::Supabase env vars are not set for this job. The"
            echo "::error::bundle would ship unconfigured and every screenshot"
            echo "::error::would be of an app that cannot reach its backend."
            exit 1
          fi
          npx --yes eas-cli@latest update --branch e2e \
            --message "e2e ${{ github.sha }}" --non-interactive --json > update.json
          ID=$(node -p "
            const raw = require('fs').readFileSync('update.json','utf8');
            const u = JSON.parse(raw.slice(raw.search(/[\[{]/)));
            (Array.isArray(u) ? u : [u]).find((x) => x.platform === 'ios')?.id ?? ''
          ")
          if [ -z "$ID" ]; then
            echo "::error::eas update published nothing for iOS. The run would"
            echo "::error::have screenshotted the binary's embedded JS instead."
            exit 1
          fi
          echo "id=$ID" >> "$GITHUB_OUTPUT"

  drive:
    needs: app
    runs-on: macos-15
    permissions:
      contents: write
    # Room for the photo waits: the flows now wait out the upload pipeline's
    # own 150s stage budget (twice, on a retry) rather than guessing shorter,
    # and a job killed by ITS timeout cancels the publish step — the run's
    # screenshots die with it, which is the worst outcome a slow runner can
    # buy. Green runs finish in ~35 minutes regardless.
    #
    # 75, not 55: run 105 was cancelled mid-flow with signed-in-tour still to
    # go. The flows now get MUCH further than they did when 55 was chosen -
    # business-tour reaches the code screen rather than dying at the photo
    # step - and each failing flow is retried once, so the ceiling that used
    # to be generous became the thing deciding the result. A cancelled job
    # answers nothing and costs a full macOS hour anyway.
    timeout-minutes: 75
    steps:
      - uses: actions/checkout@v4

      # A real signed-in session for the signed-in flow: created fresh and
      # onboarded against the live backend, destroyed in the last step.
      - name: Create a throwaway signed-in account
        env:
          EXPO_PUBLIC_SUPABASE_URL: ${{ secrets.EXPO_PUBLIC_SUPABASE_URL }}
          EXPO_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.EXPO_PUBLIC_SUPABASE_ANON_KEY }}
          # Set this secret and the throwaway account's address stops being a
          # literal in a public repo. See the fallback in e2e/account.mjs.
          TEST_EMAIL_BASE: ${{ secrets.TEST_EMAIL_BASE }}
        run: node e2e/account.mjs setup

      - name: Install the app into a booted simulator
        run: |
          set -o pipefail
          curl -fsSL "${{ needs.app.outputs.url }}" -o app.tar.gz
          mkdir sim-app && tar -xzf app.tar.gz -C sim-app
          APP=$(find sim-app -maxdepth 2 -name '*.app' | head -1)
          UDID=$(xcrun simctl list devices available -j | node -e "
            const d = JSON.parse(require('fs').readFileSync(0,'utf8')).devices;
            const phones = Object.entries(d)
              .flatMap(([rt, list]) => list.map((x) => ({ rt, ...x })))
              .filter((x) => x.name.includes('iPhone'));
            phones.sort((a, b) => b.rt.localeCompare(a.rt));
            console.log(phones[0].udid);
          ")
          echo "UDID=$UDID" >> "$GITHUB_ENV"
          echo "BUNDLE_ID=$(node -p "require('./app.json').expo.ios.bundleIdentifier")" \
            >> "$GITHUB_ENV"
          xcrun simctl boot "$UDID"
          xcrun simctl bootstatus "$UDID" -b
          # Turn the keyboard's guessing off before anything types into it.
          # Run 50 died on a details field reading "Meeting by the door around
          # 7d": the trailing "d" was iOS's inline predictive text, ghosted
          # after the cursor and sitting in the accessibility value, behind a
          # first-run "Inline Predictions" tooltip that had popped up over the
          # sheet and could have eaten the next tap as easily as the
          # assertion. Nothing to do with the app, and a whole run lost to it.
          # `|| true` because these keys move between iOS versions and a
          # missing one must not fail the job.
          for key in KeyboardPrediction KeyboardInlineCompletion \
                     KeyboardAutocorrection KeyboardShowPredictiveBar; do
            xcrun simctl spawn "$UDID" defaults write \
              com.apple.keyboard.preferences "$key" -bool false || true
          done
          xcrun simctl install "$UDID" "$APP"

      # THE STALE-SCREENSHOT TRAP, and why the next two steps look odd.
      #
      # expo-updates ships with launchWaitMs = 0. It launches on whatever
      # bundle it already has and fetches the new one in the BACKGROUND, so a
      # freshly installed app ALWAYS runs the JS that was embedded at build
      # time. The download only becomes the running code on the NEXT launch.
      # On top of that, the downloaded update lives inside the app's data
      # container ("Library/Application Support/.expo-internal"), which
      # Maestro's `clearState: true` deletes — so every flow threw the
      # download away and started over.
      #
      # Together those two facts meant every screenshot from a reused binary
      # showed the code of the last EAS BUILD rather than the commit under
      # test, silently, with the run green. So: launch once to fetch, wait
      # for the row to reach StatusReady, kill it, and let the flows launch
      # into it. State is reset between flows by hand below instead of by
      # `clearState`, so the download survives.
      - name: Fetch the published update into the app
        if: ${{ inputs.build != true }}
        run: |
          set -o pipefail
          WANT=$(echo "${{ needs.app.outputs.update-id }}" | tr -d '-' | tr 'A-Z' 'a-z')
          DATA=$(xcrun simctl get_app_container "$UDID" "$BUNDLE_ID" data)
          INTERNAL="$DATA/Library/Application Support/.expo-internal"
          xcrun simctl launch "$UDID" "$BUNDLE_ID"
          READY=0
          for _ in $(seq 1 45); do
            # Found by glob, never by name. The file is expo-v11.db today and
            # was expo-v2.db not long ago (UpdatesDatabaseInitialization.swift
            # bumps it per schema migration); hardcoding the version made this
            # gate fail two runs in a row on downloads that had actually
            # succeeded.
            # `|| true` is load-bearing. This step runs under `bash -e` with
            # pipefail, so on the very first pass — before expo-updates has
            # written anything — `ls` exits non-zero, the pipeline inherits
            # it, and the assignment kills the whole step. The loop that is
            # supposed to WAIT for this file could therefore never wait for
            # it, and every diagnostic below never printed: run 41 died 0.1s
            # after `simctl launch` finally returned, reporting only "exit 1".
            DB=$(ls "$INTERNAL"/expo-v*.db 2>/dev/null | tail -1 || true)
            # status 1 is StatusReady: manifest AND every asset downloaded.
            # A row can exist as StatusPending with the bundle still missing.
            if [ -n "$DB" ] && [ -f "$DB" ]; then
              READY=$(sqlite3 "$DB" \
                "select count(*) from updates where status = 1 and lower(hex(id)) = '$WANT';" \
                2>/dev/null || echo 0)
            fi
            if [ "$READY" = "1" ]; then
              break
            fi
            sleep 2
          done
          if [ "${READY:-0}" != "1" ]; then
            # Say WHY, while the simulator is still up and holding the
            # evidence. Guessing at this from an exit code is how the stale
            # screenshots survived as long as they did.
            echo "--- app support directory ---"
            ls -la "$DATA/Library/Application Support" "$INTERNAL" || true
            echo "--- updates known to the app ---"
            if [ -n "$DB" ] && [ -f "$DB" ]; then
              sqlite3 -header "$DB" \
                "select lower(hex(id)) as id, status, runtime_version,
                        datetime(commit_time / 1000, 'unixepoch') as committed
                   from updates order by commit_time desc limit 10;" || true
            else
              echo "no expo-v*.db in $INTERNAL — expo-updates never initialised"
            fi
            # expo-updates keeps its own log file right next to the database,
            # and it says far more than os_log does about why a check failed.
            echo "--- what expo-updates wrote down ---"
            tail -40 "$DATA/Library/Application Support"/*expo-updates*.txt 2>/dev/null || true
          fi
          xcrun simctl terminate "$UDID" "$BUNDLE_ID" || true
          if [ "${READY:-0}" != "1" ]; then
            echo "::error::The app never finished downloading update $WANT, so the"
            echo "::error::flows would have run the binary's embedded JS. If the"
            echo "::error::reused build predates the 'e2e' channel or the current"
            echo "::error::app version, re-run this workflow with build=true."
            exit 1
          fi
          echo "Update $WANT is downloaded; the next launch runs it."

      - name: Run Maestro flows
        env:
          # The driver builds an XCUITest runner via xcodebuild on first
          # launch; the default startup timeout is too short for a cold
          # runner (run 2 died on exactly this).
          MAESTRO_DRIVER_STARTUP_TIMEOUT: '240000'
          MAESTRO_CLI_NO_ANALYTICS: '1'
        run: |
          set -o pipefail
          curl -Ls https://get.maestro.mobile.dev | bash
          export PATH="$HOME/.maestro/bin:$PATH"
          mkdir -p shots && cd shots

          # Each flow starts from a first-run app: no tour dismissed, nobody
          # signed in. `clearState: true` would do that AND delete the
          # downloaded update with it (see the step above), so wipe exactly
          # what the app persists and nothing else. AsyncStorage holds both
          # the tour flag and the encrypted Supabase session, so clearing it
          # signs the account out even though the keychain half survives.
          reset_state() {
            xcrun simctl terminate "$UDID" "$BUNDLE_ID" >/dev/null 2>&1 || true
            local data
            data=$(xcrun simctl get_app_container "$UDID" "$BUNDLE_ID" data)
            rm -rf "$data/Library/Application Support/$BUNDLE_ID" \
                   "$data/Documents/RCTAsyncLocalStorage_V1" \
                   "$data/Documents/RCTAsyncLocalStorage" \
                   "$data/Library/Caches" \
                   "$data/tmp"
          }

          # Build the driver on a throwaway launch so flow #1 starts warm.
          reset_state
          maestro --udid "$UDID" test ../e2e/warmup.yml || true
          # A throwaway account per tour. Both are deleted by the teardown
          # step below, which is what lets the business tour REGISTER: one
          # account owns at most one business and register_business is not
          # idempotent, so before teardown existed the flow had to stop at the
          # confirm step and everything past it went unphotographed. That is
          # how a dead end at step 4 reached the founder.
          # One password for both tours' throwaway accounts. It has to reach
          # two steps — the flows type it, and the teardown below signs in
          # with it — so it goes through GITHUB_ENV rather than staying a
          # local. Masked because that file's contents are echoed into every
          # later step's env dump, and these are public logs.
          E2E_THROWAWAY_PASSWORD='MaestroBiz!2026'
          echo "::add-mask::$E2E_THROWAWAY_PASSWORD"
          echo "E2E_THROWAWAY_PASSWORD=$E2E_THROWAWAY_PASSWORD" >> "$GITHUB_ENV"
          # Both tours sign up, so they cannot share an address, and NEITHER
          # can share one with its own retry: an attempt that got as far as
          # create-account has taken the address, so the second attempt used
          # to fail on the screen after it and report the wrong bug. Run 79
          # lost both retries that way. A fresh pair per attempt instead.
          ATTEMPT=0
          new_addresses() {
            ATTEMPT=$((ATTEMPT + 1))
            E2E_BIZ_EMAIL="maestro-biz-$(date +%s)-$ATTEMPT@samewhere.test"
            E2E_NEW_EMAIL="maestro-new-$(date +%s)-$ATTEMPT@samewhere.test"
            # Every address this run has handed out, so teardown can reach the
            # accounts the flows made. They own real rows now: the business
            # tour registers.
            BIZ_ALL="$BIZ_ALL${BIZ_ALL:+,}$E2E_BIZ_EMAIL"
            NEW_ALL="$NEW_ALL${NEW_ALL:+,}$E2E_NEW_EMAIL"
          }
          run_flow() {
            maestro --udid "$UDID" test \
              -e E2E_EMAIL="$E2E_EMAIL" -e E2E_PASSWORD="$E2E_PASSWORD" \
              -e E2E_BIZ_EMAIL="$E2E_BIZ_EMAIL" -e E2E_NEW_EMAIL="$E2E_NEW_EMAIL" \
              -e E2E_THROWAWAY_PASSWORD="$E2E_THROWAWAY_PASSWORD" "$1"
          }
          STATUS=0
          for flow in ../e2e/flows/*.yml; do
            # One retry: the first attempt pays the driver build cost and
            # occasionally times out anyway; the second starts warm. Reset
            # before each attempt, since a half-finished flow leaves the app
            # signed in and past the tour.
            reset_state
            new_addresses
            run_flow "$flow" || {
              reset_state
              new_addresses
              run_flow "$flow"
            } || STATUS=1
          done
          echo "MAESTRO_STATUS=$STATUS" >> "$GITHUB_ENV"
          echo "E2E_BIZ_ALL=$BIZ_ALL" >> "$GITHUB_ENV"
          echo "E2E_NEW_ALL=$NEW_ALL" >> "$GITHUB_ENV"
          # Whatever happened above, capture the screen raw — pixels beat a
          # green flag, and simctl needs nothing from Maestro.
          xcrun simctl io "$UDID" screenshot zz-final-state.png || true
          # One pass at AX3 (accessibility-extra-large) for the map dock and
          # the cluster count badge: the dock is minHeight now and the badge
          # deliberately does not scale, and only a picture proves either.
          # The signed-in tour just ran, so a relaunch lands on the Map tab
          # with the Drop-a-pin dock up. Raw simctl, no assertions — this is
          # evidence, not a gate — and the size is put back afterwards so a
          # retry of anything later starts from the default.
          xcrun simctl terminate "$UDID" "$BUNDLE_ID" >/dev/null 2>&1 || true
          xcrun simctl ui "$UDID" content_size accessibility-extra-large || true
          xcrun simctl launch "$UDID" "$BUNDLE_ID" || true
          sleep 25
          xcrun simctl io "$UDID" screenshot zz-ax3-map-dock.png || true
          xcrun simctl terminate "$UDID" "$BUNDLE_ID" >/dev/null 2>&1 || true
          # The large-text tour at AX5, driven by Maestro so the two primary
          # actions are TAPPED, not only photographed: the tab bar grows with
          # Dynamic Type and useTabBarInset now scales the docks' clearance
          # with it. The flow lives OUTSIDE e2e/flows/ so the loop's glob
          # cannot run the ordinary passes at this size. `|| true` like the
          # AX3 shot above: its screenshots are the acceptance (Maestro keeps
          # them under ~/.maestro on failure and the publish step sweeps
          # both), and a warm relaunch's map tree is not reliably addressable
          # (traps), so a tap miss here is evidence to look at, not a gate.
          xcrun simctl ui "$UDID" content_size accessibility-extra-extra-extra-large || true
          maestro --udid "$UDID" test ../e2e/large-text-tour.yml || true
          xcrun simctl terminate "$UDID" "$BUNDLE_ID" >/dev/null 2>&1 || true
          xcrun simctl ui "$UDID" content_size medium || true
          ls -la

      # DID THE APP DIE, OR DID THE SCREEN JUST NOT APPEAR?
      #
      # Run 105 failed guest-tour twice on a sheet that did not open, and the
      # failure screenshot showed the app on a DIFFERENT TAB with the default
      # city thirty seconds after the tap - which is what a crash and
      # relaunch looks like, and is not something a Maestro assertion can
      # tell you. A screenshot cannot distinguish "the sheet is missing" from
      # "the process died"; iOS writes a report either way, so read it.
      #
      # `|| true` throughout and never a gate: this is evidence for whoever
      # reads the run, and a missing directory (no crashes, which is the
      # normal case) must not fail the job.
      - name: Any crash reports the simulator wrote
        if: always()
        run: |
          set +e
          DIR="$HOME/Library/Logs/DiagnosticReports"
          echo "Looking in $DIR"
          ls -la "$DIR" 2>/dev/null || echo "(no DiagnosticReports directory: nothing crashed)"
          for f in "$DIR"/*amewhere*.ips "$DIR"/*amewhere*.crash; do
            [ -e "$f" ] || continue
            echo "=================================================="
            echo "CRASH REPORT: $f"
            echo "=================================================="
            # The first 120 lines carry the exception type, the termination
            # reason and the crashing thread's top frames, which is what
            # names the bug. The rest is every other thread's stack.
            head -120 "$f"
          done
          exit 0

      # BEFORE the publish step: publishing checks out an orphan branch,
      # which deletes e2e/account.mjs from the working tree.
      - name: Destroy the throwaway account
        if: always()
        env:
          EXPO_PUBLIC_SUPABASE_URL: ${{ secrets.EXPO_PUBLIC_SUPABASE_URL }}
          EXPO_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.EXPO_PUBLIC_SUPABASE_ANON_KEY }}
        run: node e2e/account.mjs teardown

      # And the two the FLOWS made, which sign up through the UI rather than
      # through account.mjs. The business tour registers a real listing now,
      # so this is what keeps the live project clean: one account owns at most
      # one business and register_business is not idempotent, so a run that
      # left its account behind would poison every run after it.
      - name: Destroy the tours' own throwaways
        if: always()
        env:
          EXPO_PUBLIC_SUPABASE_URL: ${{ secrets.EXPO_PUBLIC_SUPABASE_URL }}
          EXPO_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.EXPO_PUBLIC_SUPABASE_ANON_KEY }}
        run: |
          IFS=','
          for address in $E2E_BIZ_ALL $E2E_NEW_ALL; do
            [ -n "$address" ] || continue
            E2E_BIZ_EMAIL="$address" E2E_NEW_EMAIL="" \
              node e2e/account.mjs teardown-extras
          done

      # Even a failed flow usually produced screenshots — publish whatever
      # exists, then fail the job afterwards so red still means broken.
      - name: Publish screenshots to the e2e-results branch
        if: always()
        run: |
          git checkout --orphan e2e-results
          git rm -rfq . || true
          mkdir -p results
          # Maestro writes takeScreenshot files to its CWD on pass but under
          # ~/.maestro/tests on failure — sweep both rather than guessing.
          find shots "$HOME/.maestro" "$GITHUB_WORKSPACE" -name '*.png' \
            -not -path '*/node_modules/*' -not -path '*/assets/*' -not -path '*/sim-app/*' \
            -exec cp {} results/ \; 2>/dev/null || true
          ls -la results/
          date -u +"%Y-%m-%dT%H:%M:%SZ" > results/RUN
          echo "${{ github.sha }}" >> results/RUN
          git add results
          git -c user.name=e2e -c user.email=e2e@local commit -m "e2e screenshots"
          git push --force origin e2e-results

      - name: Propagate flow failures
        if: always()
        run: exit "${MAESTRO_STATUS:-1}"

  # Pixels are the point of this workflow, and twenty loose PNGs on a branch
  # are not something a person reviews from a phone. Assemble them into one
  # self-contained page and push it back alongside them. Runs on ubuntu even
  # though the shots come from macOS: the 10x-billed runner should not be
  # paying for image encoding.
  gallery:
    needs: drive
    if: always()
    runs-on: ubuntu-latest
    permissions:
      contents: write
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      # Just the encoder, not the whole tree: a full install here would cost
      # more than the job it serves.
      - name: Install the image encoder
        run: npm install --no-save --no-audit --no-fund jimp-compact
      - name: Build the gallery
        run: |
          set -o pipefail
          git fetch origin e2e-results --depth 1
          rm -rf shots && mkdir shots
          git --work-tree=shots checkout FETCH_HEAD -- results
          # If the run died before publishing, the branch still holds the
          # PREVIOUS run's shots. Rebuilding a gallery from those and calling
          # it this run's would be the worst kind of wrong.
          if ! grep -qx "${{ github.sha }}" shots/results/RUN; then
            echo "::warning::e2e-results does not hold this run's shots; skipping the gallery."
            echo "SKIP=1" >> "$GITHUB_ENV"
            exit 0
          fi
          node scripts/screens-gallery.mjs shots/results "$RUNNER_TEMP/screens.html"
      # Onto the same branch the shots live on, because workflow artifacts
      # cannot be fetched from the development sandbox but a branch can.
      - name: Publish the gallery to the e2e-results branch
        if: ${{ env.SKIP != '1' }}
        run: |
          set -o pipefail
          git reset
          git checkout -B e2e-results FETCH_HEAD
          cp "$RUNNER_TEMP/screens.html" screens.html
          git add screens.html
          git -c user.name=e2e -c user.email=e2e@local commit -m "e2e gallery"
          git push --force origin e2e-results
