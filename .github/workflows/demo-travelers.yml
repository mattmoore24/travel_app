# Demo travelers for testing the Travelers tab, matching, pins and messaging.
# Creates them through the public signup path with the anon key (no elevated
# privileges), purges them the same way through delete-account, and drives
# the message-request loop from their side so both ends of it can be seen on
# a real phone.
#
# These are not real people: AI-generated portraits, [demo] marked bios.
# LAUNCH_RUNBOOK step 5 requires purging before real users arrive.
#
# Seeding cannot mark anybody verified: this runs on the anon key on purpose,
# and profiles.verified has no client grant. To test the "who can see you"
# audiences, flip them by hand in the Supabase SQL editor:
#
#   update public.profiles set verified = true where bio like '%[demo]%';
#
# ALL of them, not a sample. This used to say `limit 4`, with no order by, so
# it picked an arbitrary four across four cities and four staggered trip
# windows and usually left the city you were testing from with nobody. See
# docs/ARCHITECTURE.md "Who can see you" for the per-city gender spread.
#
# Secrets: EXPO_PUBLIC_SUPABASE_URL, EXPO_PUBLIC_SUPABASE_ANON_KEY, DEMO_PASSWORD
name: Demo travelers

on:
  workflow_dispatch:
    inputs:
      action:
        description: >-
          seed/purge the accounts, or drive the request loop: accept (they
          answer a request you sent), ping (one of them writes to you), both
        type: choice
        options: [seed, purge, accept, ping, both]
        default: seed

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: ${{ inputs.action }} demo travelers
        env:
          EXPO_PUBLIC_SUPABASE_URL: ${{ secrets.EXPO_PUBLIC_SUPABASE_URL }}
          EXPO_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.EXPO_PUBLIC_SUPABASE_ANON_KEY }}
          DEMO_PASSWORD: ${{ secrets.DEMO_PASSWORD }}
          # Demo accounts plus-address this inbox. Required, so nobody's
          # personal address has to live in a public repo as a fallback.
          TEST_EMAIL_BASE: ${{ secrets.TEST_EMAIL_BASE }}
        run: |
          case "${{ inputs.action }}" in
            seed|purge) node scripts/seed-demo-travelers.mjs "${{ inputs.action }}" ;;
            *)          node scripts/demo-interactions.mjs "${{ inputs.action }}" ;;
          esac
