# Runs a Metro dev server on a GitHub runner and exposes it through a tunnel,
# so the app can be opened in Expo Go on a phone. Exists because development
# happens from a phone with no computer to run `npx expo start` on.
#
# Required repository secrets (Settings -> Secrets and variables -> Actions):
#   EXPO_PUBLIC_SUPABASE_URL       same project URL used everywhere else
#   EXPO_PUBLIC_SUPABASE_ANON_KEY  the ANON key (public by design; never
#                                  service_role, which would ship full
#                                  database access to every user)
#
# The tunnel dies when the job ends, so this is a session, not a deployment.
name: Expo Go session

on:
  workflow_dispatch:
    inputs:
      minutes:
        description: 'Minutes to keep the session alive (max 300)'
        type: string
        default: '45'

jobs:
  session:
    runs-on: ubuntu-latest
    # Job timeout must exceed the requested session or the run is killed
    # mid-session with no summary.
    timeout-minutes: 310
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Check required secrets
        env:
          URL: ${{ secrets.EXPO_PUBLIC_SUPABASE_URL }}
          KEY: ${{ secrets.EXPO_PUBLIC_SUPABASE_ANON_KEY }}
        run: |
          missing=()
          [ -n "$URL" ] || missing+=(EXPO_PUBLIC_SUPABASE_URL)
          [ -n "$KEY" ] || missing+=(EXPO_PUBLIC_SUPABASE_ANON_KEY)
          if [ ${#missing[@]} -gt 0 ]; then
            echo "::error::Missing repository secrets: ${missing[*]}"
            echo "Without them the app runs with no backend and every screen fails."
            exit 1
          fi

      - name: Install
        run: npm ci

      - name: Start tunnelled dev server
        env:
          EXPO_PUBLIC_SUPABASE_URL: ${{ secrets.EXPO_PUBLIC_SUPABASE_URL }}
          EXPO_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.EXPO_PUBLIC_SUPABASE_ANON_KEY }}
          EXPO_NO_TELEMETRY: '1'
          # CI=1 is how the CLI is told to run non-interactively; the old
          # --non-interactive flag was removed. Do NOT set this to an empty
          # string to "unset" it — Expo parses CI as a boolean and an empty
          # value throws GetEnv.NoBoolean before the server ever starts.
          CI: '1'
        run: |
          npm install --global @expo/ngrok@^4.1.0
          nohup npx expo start --tunnel > expo.log 2>&1 &
          EXPO_PID=$!
          echo "Waiting for the tunnel…"
          URL=""
          for i in $(seq 1 90); do
            # Bail the moment the server dies rather than waiting out the full
            # loop — the first version spent 7 minutes waiting on a process
            # that had already exited.
            if ! kill -0 "$EXPO_PID" 2>/dev/null; then
              echo "::error::Dev server exited before the tunnel came up."
              cat expo.log
              exit 1
            fi
            URL=$(grep -oE 'exp://[^[:space:]]+' expo.log | head -1 || true)
            [ -n "$URL" ] && break
            sleep 5
          done
          if [ -z "$URL" ]; then
            echo "::error::Tunnel did not come up in time. Log follows:"
            cat expo.log
            exit 1
          fi
          echo "::notice title=Open this in Expo Go::$URL"
          {
            echo "## Open in Expo Go"
            echo
            echo '```'
            echo "$URL"
            echo '```'
            echo
            echo "Expo Go -> Enter URL manually -> paste."
          } >> "$GITHUB_STEP_SUMMARY"
          printf '%s\n' "$URL" > session-url.txt
          cat expo.log

      # GitHub serves no job logs over the API until a job finishes, and this
      # job deliberately runs for the whole session — so the URL would be
      # unreadable except by opening the web page. An artifact is available as
      # soon as it uploads, mid-run.
      - name: Publish the URL as an artifact
        uses: actions/upload-artifact@v4
        with:
          name: expo-session-url
          path: session-url.txt
          retention-days: 1

      - name: Hold the session open
        run: |
          MINUTES=${{ inputs.minutes }}
          case "$MINUTES" in ''|*[!0-9]*) MINUTES=45 ;; esac
          [ "$MINUTES" -gt 300 ] && MINUTES=300
          echo "Session open for $MINUTES minutes. Cancel the run to end it early."
          sleep $(( MINUTES * 60 ))

      - name: Dev server log
        if: always()
        run: tail -120 expo.log || true
