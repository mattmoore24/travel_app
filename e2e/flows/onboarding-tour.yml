# Making a profile, which the suite has never photographed either.
#
# The signed-in tour signs into an account that is already onboarded, and the
# guest tour never makes one (it browses, meets the gate, and photographs the
# chooser and the map on the way past), so the front door of the whole
# app — the screens that decide whether somebody ends up with a profile at all
# — has had no picture of it. It just went from seven steps to thirteen.
#
# WHAT THIS COVERS, and what it does not. It walks the three steps nobody can
# get past without answering: who you are, where you are from, and the photo.
# Those are the ones where a break means nobody can create an account. It
# stops at the photo gate, because getting past it means driving the iOS photo
# picker, and a flaky system-dialog dance would make every run's verdict about
# the harness rather than the app. Steps 6 to 13 are held by the 22 source
# assertions in src/app/__tests__/onboarding-sequence.test.ts instead — which
# is weaker than a picture, and worth saying out loud.
#
# Runs on its own throwaway account (E2E_NEW_EMAIL, unique per run, and a
# different one from the business tour's — they both sign up, and the second
# would be refused an address the first had already taken). It never stamps
# onboarding_completed_at, so what it leaves behind is an unfinished profile:
# invisible in Travelers, invisible on the map, exactly like somebody who
# closed the app half way through.
#
# THE INTENT CARRIED ACROSS THE WALL has two map origins
# (map-carries-your-intent-through-signup), and they cannot both be proven in
# one run: the store holds ONE pendingIntent and this flow signs up ONCE. So
# the door into signup decides which replay the tail asserts, and the tail
# hard-asserts exactly the one that matches:
#
#   PIN variant — the guest opens a traveler's pin card from the plan list
#   (markers are MapKit's and not in the tree; the list rows are ours) and
#   takes its gate. After finish-profile the SAME pin's card must be open on
#   the same city ('View <venue> in Maps' is on every pin card).
#
#   DROP-PIN variant — the guest taps Drop a pin and takes that gate. After
#   finish-profile the map must come back IN PLACE MODE ('Pin here').
#
# Which door is taken depends on live-backend supply: a pin card only gates
# for a TRAVELER's pin — a curated pick's card has no gate by design, guests
# may read our picks freely — and the seeder guarantees only picks. So the
# pin door is taken whenever a traveler pin is row 0 of the plan list, and
# the drop-pin door is the deterministic fallback. A run's screenshots say
# which variant it proved: 75-signup-done-pin-replay or 75-signup-done. The
# regression either tail catches is the same one: an intent recorded at a
# gate and thrown away by signup.
appId: com.mattmoore.samewhere
---
- launchApp
- extendedWaitUntil:
    visible: 'Skip'
    timeout: 20000
- tapOn: 'Skip'
- extendedWaitUntil:
    visible: 'Travelers'
    timeout: 30000
# THE PIN DOOR, attempted first. Rows are addressable by testID; the peek may
# still be settling (the pins query), so it gets a real wait — but every step
# stays optional: a city with no list at all falls through to the drop-pin
# door below.
- extendedWaitUntil:
    visible:
      id: 'plan-list-peek'
    timeout: 10000
    optional: true
- tapOn:
    id: 'plan-list-peek'
    optional: true
- waitForAnimationToEnd:
    timeout: 2000
- tapOn:
    id: 'plan-list-row-0'
    optional: true
- waitForAnimationToEnd:
    timeout: 2000
# Row 0 opened a traveler's pin: its gate is up. Take it — this records the
# {kind: 'pin'} intent — and skip the drop-pin door entirely.
- runFlow:
    when:
      visible: "See who's going and say hi"
    commands:
      - takeScreenshot: 49-pin-card-gate
      - tapOn: 'Make a profile'
      # Waited out HERE, not only at the shared step below: the sheet leaves
      # first and the push lands after its exit animation, so the fallback
      # block's notVisible check would otherwise run mid-navigation and tap
      # 'Drop a pin' on a screen that no longer has one.
      - extendedWaitUntil:
          visible: 'What are you signing up as?'
          timeout: 10000
# Otherwise row 0 was a curated pick (no gate) or there was no list: close
# whatever opened, toggle the list, and take the drop-pin door. The toggle is
# belt-and-braces now, not a requirement: the dock is painted OVER the plan
# list's sheet at every detent, so 'Drop a pin' is on screen whether this tap
# folds the list or opens it.
- runFlow:
    when:
      notVisible: 'What are you signing up as?'
    commands:
      - tapOn:
          text: 'Close'
          optional: true
      - waitForAnimationToEnd:
          timeout: 2000
      - tapOn:
          id: 'plan-list-peek'
          optional: true
      - waitForAnimationToEnd:
          timeout: 2000
      - tapOn: 'Drop a pin'
- extendedWaitUntil:
    visible: 'Make a profile'
    timeout: 10000
    optional: true
- tapOn:
    text: 'Make a profile'
    optional: true
- extendedWaitUntil:
    visible: 'What are you signing up as?'
    timeout: 10000
# The founder's replacement line for a person, asserted: the old one told
# people what the address was NOT for, which is a strange thing to raise
# unprompted.
- assertVisible: 'Your email is never shown to other users.*'
- takeScreenshot: 50-signup-email

- tapOn:
    id: 'email-input'
- inputText: ${E2E_NEW_EMAIL}
- pressKey: Enter
- extendedWaitUntil:
    visible: 'Pick a password'
    timeout: 10000
- tapOn:
    id: 'password-input'
- inputText: ${E2E_THROWAWAY_PASSWORD}
# The consent line under the create-account button is the App Review 1.2
# surface: the agreement has to be readable at the moment it is made, so both
# policy links must be on this screen. Wildcards on both sides because iOS
# may expose the sentence as one element or as link fragments.
- assertVisible: '.*house rules.*'
- assertVisible: '.*privacy policy.*'
- tapOn:
    id: 'create-account'
- tapOn:
    text: 'Not Now'
    optional: true

# STEP 3 — who you are. No skip, and there should not be one.
- extendedWaitUntil:
    visible: 'Who are you?'
    timeout: 30000
- tapOn:
    text: 'Not Now'
    optional: true
- takeScreenshot: 51-signup-who
- tapOn:
    id: 'name-input'
- inputText: 'Maestro Newcomer'
- pressKey: Enter
- tapOn:
    id: 'age-input'
- inputText: '29'
# Continue with the gender question unanswered is refused, and the shell's
# note says which answer is outstanding. This is the finding that made the
# change: name and age valid used to be enough, and the women-only filter's
# data shipped as 'unspecified' from people who never saw the question.
- tapOn: 'Continue'
- assertVisible: 'Pick a gender.*'
- takeScreenshot: 51b-signup-who-gender-note
# The select opens the app's own sheet through a native Modal, dismissing the
# number pad first (select-field.tsx), so wait for the rows to land.
- tapOn:
    id: 'gender-select'
- extendedWaitUntil:
    visible: 'Woman'
    timeout: 10000
- tapOn: 'Woman'
- waitForAnimationToEnd:
    timeout: 1500
- tapOn: 'Continue'

# STEP 4 — where you are from.
- extendedWaitUntil:
    visible: 'Where are you from?'
    timeout: 15000
- tapOn:
    id: 'city-input'
- inputText: 'Lisbon'
- pressKey: Enter
- tapOn:
    id: 'country-input'
- inputText: 'Portugal'
# Return, not the accessory bar's Done: iOS blurs a single-line field on
# submit, and taps on the Done bar do not reliably land because iOS hosts it
# in the keyboard's own window. Run 80 died on the next command for exactly
# that reason — the keyboard was still up, so Maestro's scroll swipe landed
# on the docked footer instead of the scroller, and Languages never came into
# view.
- pressKey: Enter
- takeScreenshot: 52-signup-home

# Languages, which step 4 will not let go without. The picker is the app's own
# sheet rather than a system dialog, so it is safe to drive.
# The FIELD, not the section heading above it. Run 79 tapped the heading,
# which is a label and does nothing, and then waited out its timeout on a
# sheet that had never been asked to open.
# By the FIELD's accessibility label, not the words inside it. The opener is a
# PressableScale with accessibilityRole="button" and its own label, which makes
# iOS treat the whole thing as one element and hides the "Pick the ones you
# speak" text from the tree. Run 79 tapped the section heading, run 83 scrolled
# to a field already on screen (scrollUntilVisible at 100% fails on a page that
# cannot scroll), and run 84 tapped text no longer addressable. Third time.
- tapOn: 'Languages you speak'
- extendedWaitUntil:
    visible:
      id: 'language-search'
    timeout: 10000
- tapOn:
    id: 'language-search'
- inputText: 'English'
- waitForAnimationToEnd:
    timeout: 1500
# By id: the search box above holds the word that was just typed into it, so
# tapping "English" matches two elements and lands on the field. Run 86 came
# out of this sheet with nothing selected.
- tapOn:
    id: 'language-option-en'
- tapOn: 'Done'
- waitForAnimationToEnd:
    timeout: 1500
# The chosen language shows as a chip INSIDE the field, and the field is a
# pressable with its own accessibility label, so iOS hides the chip's text
# from the tree — run 87 failed this assertion with English plainly chosen in
# the picture. The note going away is the addressable proof that the step is
# satisfied.
- assertNotVisible: 'Add where you are from and at least one language.*'
- takeScreenshot: 53-signup-home-filled
- tapOn: 'Continue'

# STEP 5 — the photo, which moved from last to fifth. Hinge's order, and the
# right one: a face makes the rest worth answering, and somebody who quits
# here still has a profile another person could act on.
#
# The gate is asserted rather than driven past: getting a photo in means
# driving the iOS picker, and a flaky system-dialog dance would make every
# run's verdict about the harness rather than the app. The note under the
# button is the whole claim — this step cannot be passed, and it says why.
- extendedWaitUntil:
    visible: 'Add a photo'
    timeout: 15000
- assertVisible: 'A profile photo is the one thing we need.'
- takeScreenshot: 54-signup-photo-gate

# Climbing the wall. Every command in the subflow is optional because it
# drives Apple's picker rather than ours; everything after this runs only if
# a photo actually landed, so a picker that has moved between iOS versions
# costs the run its later pictures and not its verdict.
- tapOn:
    text: 'Add your profile photo'
    optional: true
- runFlow: ../subflows/pick-a-photo.yml
# The photo is IN the tile before it is anywhere near the server. Both
# conditions together are exactly "a local upload is in flight": the empty
# add tile is gone (something occupies slot 0) and the row has not landed
# (the footer still asks for a photo). The old grid could satisfy neither -
# it kept the empty dashed box, spun every other one with it, and held no
# copy of the file to show or to retry. Guarded because the picker above is
# Apple's, not ours, and may simply not have produced a photo.
- runFlow:
    when:
      notVisible: 'Add your profile photo'
      visible: 'A profile photo is the one thing we need.'
    commands:
      - assertVisible: 'Your profile photo, uploading'
      - takeScreenshot: 54b-photo-uploading
- waitForAnimationToEnd:
    timeout: 4000
# The pipeline's bounded stages (image-upload.ts) promise that within 150s a
# picked photo has either landed — finish-photos appears — or "Could not save
# … so try again" is on screen. Run 95's first attempt tapped finish-photos
# ten seconds after the pick, while a render allowed 90s on a cold simulator
# was still working; run 93's died with the alert covering the gate text. So:
# wait out the budget when a pick is actually in flight (the gate line gone
# is what says so), recover through the app's own retry if it ended in the
# alert, then proceed.
- runFlow:
    when:
      notVisible: 'A profile photo is the one thing we need.'
    commands:
      - extendedWaitUntil:
          visible:
            id: 'finish-photos'
          timeout: 150000
          optional: true
- runFlow:
    when:
      visible: 'Could not save'
    commands:
      - tapOn: 'OK'
      - tapOn:
          text: 'Add your profile photo'
          optional: true
      - runFlow: ../subflows/pick-a-photo.yml
      - waitForAnimationToEnd:
          timeout: 4000
- takeScreenshot: 55-signup-photo-added

- runFlow:
    when:
      notVisible: 'A profile photo is the one thing we need.'
    commands:
      - extendedWaitUntil:
          visible:
            id: 'finish-photos'
          timeout: 150000
      - tapOn:
          id: 'finish-photos'
      # STEP 6 — what you do. The first step that may be skipped, so the
      # first that carries a skip under the button — and the skip names its
      # own subject now, so the person is told what they are passing over.
      # Its absence on steps 3 to 5 is how somebody can tell those are
      # required.
      - extendedWaitUntil:
          visible: 'What do you do?'
          timeout: 15000
      - assertVisible: 'Skip what you do for now'
      - takeScreenshot: 56-signup-occupation
      - tapOn:
          id: 'occupation-input'
      - inputText: 'Nurse, between contracts'
      - pressKey: Enter
      - tapOn: 'Continue'
      # STEP 7 — the bio.
      - extendedWaitUntil:
          visible: 'A bit about you'
          timeout: 15000
      - tapOn:
          id: 'bio-input'
      - inputText: 'Street food missions and long walks. Terrible at surfing, still going.'
      - takeScreenshot: 57-signup-bio
      - tapOn: 'Continue'
      # STEPS 8, 9, 10 — prompts, priorities and trips. Each hands over to
      # the editor that owns it, which has its own pictures, so the flow
      # photographs the step and takes its skip. Step 10 is the one that
      # matters most and the one nothing used to ask: a profile with no trip
      # is invisible to the feature the whole app exists for, which is why
      # its skip says what it says rather than "Skip for now".
      - extendedWaitUntil:
          visible: 'Answer a prompt'
          timeout: 15000
      - takeScreenshot: 58-signup-prompts
      - tapOn: 'Skip the prompts for now'
      - extendedWaitUntil:
          visible: 'What are you after?'
          timeout: 15000
      - takeScreenshot: 59-signup-priorities
      - tapOn: 'Skip this for now'
      - extendedWaitUntil:
          visible: 'Where are you going?'
          timeout: 15000
      # The skip and the line naming what it closes. Both exact: the note is
      # the whole point of the step's redesign — the wall on the Travelers
      # tab is the second half of this sentence.
      - assertVisible: "I'll add it later"
      - assertVisible: 'Travelers stays closed until you do. The map does not.'
      - takeScreenshot: 70-signup-trips
      - tapOn: "I'll add it later"
      # STEP 11 — socials, and the §7 promise about them said out loud.
      - extendedWaitUntil:
          visible: 'Your socials'
          timeout: 15000
      - assertVisible: 'Nobody sees these until you are both in a chat.*'
      - takeScreenshot: 71-signup-socials
      - tapOn: 'Skip your socials for now'
      # STEP 12 — audience. No skip, because it has a default rather than
      # because it is compulsory, and the narrowed rows are inert until a
      # badge exists. That is the server's rule, and the step exists so
      # nobody finishes without learning the setting is there. For this
      # unverified account it reads as a statement and the button says
      # "Got it": nothing here asks for a decision that cannot be made.
      - extendedWaitUntil:
          visible: 'Who can see you'
          timeout: 15000
      - assertVisible: 'Got it'
      - takeScreenshot: 72-signup-audience
      # A LOCKED ROW IS A DOOR, NOT A WALL. The step named the badge, said it
      # lived somewhere else, and did nothing at all when a locked row was
      # tapped - so a woman finishing signup was set to Everyone and never
      # asked again. router.push('/verification') cannot work from here
      # (that route is behind `signedIn && onboarded`, which an onboarding
      # account is neither half of), so the capture opens in place. Tapped by
      # its spoken label, which carries the appended reason.
      - tapOn: 'Verified women.*'
      - extendedWaitUntil:
          visible: 'Get your badge'
          timeout: 15000
      - assertVisible: 'Take a selfie'
      - takeScreenshot: 72b-signup-badge-door
      # Back closes the door rather than leaving step 12, because the capture
      # is this step with the door open and not a step of its own.
      - tapOn: 'Back'
      - extendedWaitUntil:
          visible: 'Who can see you'
          timeout: 15000
      - tapOn: 'Got it'
      # STEP 13 — THE PROFILE ITSELF, which is the founder's "final look of
      # how your profile appears to other users", rendered by the component a
      # stranger gets. Never once photographed before this run.
      - extendedWaitUntil:
          visible: 'Here you are'
          timeout: 15000
      - waitForAnimationToEnd:
          timeout: 2500
      - takeScreenshot: 73-signup-review
      - scroll
      - takeScreenshot: 74-signup-review-scrolled
      # THE REVIEW IS A DOOR, NOT A WALL. The step used to render the
      # stranger's copy under "step back to change anything", where back was
      # a one-step chevron: fixing the bio from here cost six Back taps
      # through six animated transitions. Owner mode puts an Edit on every
      # section, each one jumps to the step that owns it, and Continue comes
      # straight back to the review.
      - scrollUntilVisible:
          element:
            text: 'Edit about'
          direction: DOWN
          timeout: 10000
      - tapOn: 'Edit about'
      - extendedWaitUntil:
          visible: 'A bit about you'
          timeout: 15000
      - takeScreenshot: 74b-review-jumped-to-the-bio
      - tapOn: 'Continue'
      - extendedWaitUntil:
          visible: 'Here you are'
          timeout: 15000
      - waitForAnimationToEnd:
          timeout: 2000
      - takeScreenshot: 74c-review-came-back
      - tapOn:
          id: 'finish-profile'
      # And out into the app, which is the proof the stamp landed.
      - extendedWaitUntil:
          visible: 'Travelers'
          timeout: 25000
      # THE INTENT CARRIED ACROSS THE WALL (map-carries-your-intent-through-
      # signup): whichever gate this run entered signup through, its replay
      # must be on screen — and the two end states are mutually exclusive, so
      # the tail asserts exactly the one that matches the door taken above.
      # 'Pin here' is place mode (the drop-pin variant); when it never comes,
      # the pin variant ran and the SAME pin's card must be open — every pin
      # card carries the maps link, spoken as 'View <venue> in Maps'. A run
      # where NEITHER appears fails here, which is the regression this tail
      # exists to catch: an intent recorded at a gate and dropped by signup.
      - extendedWaitUntil:
          visible: 'Pin here'
          timeout: 20000
          optional: true
      - runFlow:
          when:
            visible: 'Pin here'
          commands:
            # THE DROP-PIN VARIANT, proven: the map came back IN PLACE MODE
            # at the spot the guest had. 75-signup-done photographs it.
            - takeScreenshot: 75-signup-done
            # Leave place mode so the flow ends on the ordinary map, the
            # state the screenshot used to show.
            - tapOn: 'Cancel'
            - waitForAnimationToEnd:
                timeout: 2000
      - runFlow:
          when:
            notVisible: 'Pin here'
          commands:
            # THE PIN VARIANT, proven: the card the guest was reading when
            # the wall interrupted them is open again, on its own city. The
            # wait is not slack — the replay holds the card until the city's
            # pins have refetched under the new account. (A pin that burns
            # out during the minutes signup takes degrades the replay to the
            # city alone BY DESIGN; that rare race shows here as a red tail
            # over a bare-map screenshot. Re-run it — never loosen this.)
            - extendedWaitUntil:
                visible: 'View .* in Maps'
                timeout: 20000
            - takeScreenshot: 75-signup-done-pin-replay
            - tapOn: 'Close'
            - waitForAnimationToEnd:
                timeout: 2000
