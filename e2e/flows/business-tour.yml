# The business path, which until now had no picture of it at all.
#
# The only business screen the suite has ever photographed is the account-kind
# chooser in guest-tour, and the founder found out the hard way what that
# costs: a signup that asks for a map tap and never an address, an email step
# that promised travelers would reach you at an address no traveler can see,
# and a confirmation screen that crashed the app after the listing had already
# gone live.
#
# This runs on a THROWAWAY account, unique per run (E2E_BIZ_EMAIL), and stops
# before registering anything. What it leaves behind is an auth row that never
# finished a profile, which is the same state a person who abandons signup
# leaves. Nothing reaches the map.
appId: com.mattmoore.samewhere
---
- launchApp
- extendedWaitUntil:
    visible: 'Skip'
    timeout: 20000
- tapOn: 'Skip'
- extendedWaitUntil:
    visible: 'Travelers'
    timeout: 30000

# In through the door a business owner actually finds: the gate on dropping a
# pin leads with "Make a profile", and that is /join with the kind question on
# it.
- tapOn: 'Drop a pin'
- extendedWaitUntil:
    visible: 'Make a profile'
    timeout: 10000
    optional: true
- tapOn:
    text: 'Make a profile'
    optional: true
- extendedWaitUntil:
    visible: 'What are you signing up as?'
    timeout: 10000
- tapOn: 'I run a business'
- waitForAnimationToEnd:
    timeout: 1500
# The founder's replacement copy, asserted rather than only photographed: the
# old line told a business its sign-in email was the one customers would use,
# which was never true.
- assertVisible: 'This email is just for signing in.*'
- takeScreenshot: 40-business-email-copy

- tapOn:
    id: 'email-input'
- inputText: ${E2E_BIZ_EMAIL}
- pressKey: Enter
- extendedWaitUntil:
    visible: 'Pick a password'
    timeout: 10000
- tapOn:
    id: 'password-input'
- inputText: ${E2E_THROWAWAY_PASSWORD}
- tapOn:
    id: 'create-account'
- tapOn:
    text: 'Not Now'
    optional: true

# NAME AND KIND
- extendedWaitUntil:
    visible: "What's your business called?"
    timeout: 30000
- tapOn:
    text: 'Not Now'
    optional: true
- tapOn:
    id: 'business-name-input'
- inputText: 'Maestro Cafe'
- pressKey: Enter
- tapOn: 'Cafe'
- takeScreenshot: 41-business-name
- tapOn:
    id: 'business-name-continue'

# WHERE IS IT — the step the founder asked for. An address first, with
# suggestions, and a marker underneath that moving does not overwrite it.
- extendedWaitUntil:
    visible: 'Where is it?'
    timeout: 15000
- takeScreenshot: 42-business-where-empty
# The city has to be CHOSEN now. It used to default to whichever launch city
# the query returned first, so an owner who never touched the chips filed
# their business in a city they never picked.
- tapOn: 'Lisbon'
- waitForAnimationToEnd:
    timeout: 2000
- tapOn:
    id: 'business-address-input'
- inputText: 'Rua da Rosa'
# Suggestions arrive on a pause in typing, not on a button. While the field
# has focus the step hides its chips and its map, so the list gets the screen
# — run 79 photographed the first suggestion sliced in half by the docked
# button, which is the bug this flow now proves is gone.
- waitForAnimationToEnd:
    timeout: 4000
- takeScreenshot: 43-business-address-typing
# By index, not by words: the suggestion repeats what is in the box above it,
# so driving this by its text matches two elements.
- tapOn:
    id: 'address-suggestion-0'
- waitForAnimationToEnd:
    timeout: 1500
# Picking sets BOTH the address text and the marker, which is the whole
# contract of this step. The map is back now that the field has let go.
- takeScreenshot: 44-business-address-and-marker
- assertVisible: 'Move the marker as much as you like.*'

- takeScreenshot: 45-business-where-final

# THE CONFIRM STEP, which is the founder's "the business will have the option
# to confirm the address and pin location after completing the where is it
# section". Reaching it writes nothing.
- tapOn:
    id: 'business-place-continue'
- extendedWaitUntil:
    visible: 'Is this right?'
    timeout: 15000
- takeScreenshot: 46-business-confirm

# REGISTERING, which the suite could not do until the workflow learned to
# delete this account afterwards. One account owns at most one business and
# register_business is not idempotent, so every run used to stop here — and
# everything past this line had never been photographed, which is how a dead
# end at step 4 reached the founder.
- tapOn:
    id: 'business-confirm-place'

# STEP 6 — how people reach you. The founder's phone and WhatsApp, which need
# no code: "Just add those as a contact option without requiring a code for
# now."
- extendedWaitUntil:
    visible: 'How do people reach you?'
    timeout: 25000
- tapOn:
    id: 'business-email-input'
- inputText: ${E2E_BIZ_EMAIL}
# Return, not the accessory bar's Done: iOS blurs a single-line field on
# submit, and taps on the Done bar do not reliably land because iOS hosts it
# in the keyboard's own window. A scroll with the keyboard still up swipes the
# docked footer rather than the scroller and moves nothing.
- pressKey: Enter
- scrollUntilVisible:
    element:
      id: 'business-phone-input'
    direction: DOWN
    timeout: 8000
- tapOn:
    id: 'business-phone-input'
- inputText: '+351 912 345 678'
# One number, not two. Tapping a second field while a keyboard is up does not
# reliably move focus under XCUITest — signed-in-tour.yml has said so since
# run 23 — and a phone pad has no Return to leave with. Run 84 typed the
# WhatsApp number into the phone field on top of the first, making 33
# characters, which the validator refuses at 30. What this step has to prove
# is the founder's ask that a number can be a contact at all; the WhatsApp
# field is asserted present and left empty, which is also the commonest real
# answer.
- assertVisible:
    id: 'business-whatsapp-input'
- takeScreenshot: 47-business-contact
- tapOn:
    id: 'business-contact-continue'

# STEP 7 — photos, and the wall. A listing cannot go on without one.
- extendedWaitUntil:
    visible: 'Show the place'
    timeout: 20000
- assertVisible: 'One photo is the only thing we need here.'
- takeScreenshot: 48-business-photos
- tapOn:
    id: 'business-add-photos'
- waitForAnimationToEnd:
    timeout: 3000
- tapOn:
    text: 'Add your cover photo'
    optional: true
- runFlow: ../subflows/pick-a-photo.yml
- waitForAnimationToEnd:
    timeout: 3000
- takeScreenshot: 49-business-photo-added
- tapOn:
    text: 'Close'
    optional: true

# Back on the step, and the count has to catch up before Continue will move.
# On the live project require_photo_moderation is ON, so a fresh photo holds
# at 'pending' until the worker's next tick approves it — and until
# 20260829180000 there was no worker branch and no trigger at all, so this
# count sat at zero forever and the step could never be passed. Waiting for
# the label to change is the end-to-end proof that the pipeline exists.
- extendedWaitUntil:
    visible: 'Show the place'
    timeout: 20000
- extendedWaitUntil:
    visible: '1 added. Add more'
    timeout: 120000
    optional: true
- takeScreenshot: 50-business-photo-counted
- tapOn:
    id: 'business-photos-continue'
- waitForAnimationToEnd:
    timeout: 2000

# Everything below runs only if a photo actually landed. Driving Apple's
# picker is the one part of this suite that depends on somebody else's UI, so
# it is allowed to fail without taking the run with it — the four screenshots
# above are the founder's two asks either way, and the pictures say plainly
# whether the wall was climbed.
- runFlow:
    when:
      visible: 'What is it like?'
    commands:
      # Description and hours both open the business editor rather than
      # taking text inline, and that editor has its own pictures elsewhere.
      # What matters here is that a skippable step SAYS it is skippable, in
      # the founder's words, and that skipping works.
      - takeScreenshot: 60-business-description
      - tapOn:
          text: 'Skip for now'
      - extendedWaitUntil:
          visible: 'When are you open?'
          timeout: 15000
      - takeScreenshot: 61-business-hours
      - tapOn:
          text: 'Skip for now'
      - extendedWaitUntil:
          visible: 'Anywhere else to send people?'
          timeout: 15000
      - takeScreenshot: 62-business-links
      - tapOn:
          text: 'Skip for now'
      # THE LISTING AS A TRAVELER MEETS IT. The founder's "final look of how
      # your profile appears to other users": the cover photo at the top, the
      # name, whether you are open, the address. Not a count of what you
      # filled in.
      - extendedWaitUntil:
          visible: 'Here it is'
          timeout: 15000
      - waitForAnimationToEnd:
          timeout: 2500
      - takeScreenshot: 63-business-review
      - tapOn:
          id: 'business-review-continue'
      # THE LAST STEP, showing the address the code is going to. Stops before
      # sending: the mail cannot leave Resend until a domain is verified
      # (docs/LAUNCH_RUNBOOK.md step 2), and a code sent to a .test address
      # nobody reads proves nothing.
      - extendedWaitUntil:
          visible: 'One last thing'
          timeout: 15000
      - takeScreenshot: 64-business-code-step
