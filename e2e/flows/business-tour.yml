# The business path, which until now had no picture of it at all.
#
# The only business screen the suite has ever photographed is the account-kind
# chooser in guest-tour, and the founder found out the hard way what that
# costs: a signup that asks for a map tap and never an address, an email step
# that promised travelers would reach you at an address no traveler can see,
# and a confirmation screen that crashed the app after the listing had already
# gone live.
#
# This runs on a THROWAWAY account, unique per run (E2E_BIZ_EMAIL), and stops
# before registering anything. What it leaves behind is an auth row that never
# finished a profile, which is the same state a person who abandons signup
# leaves. Nothing reaches the map.
appId: com.mattmoore.samewhere
---
- launchApp
- extendedWaitUntil:
    visible: 'Skip'
    timeout: 20000
- tapOn: 'Skip'
- extendedWaitUntil:
    visible: 'Travelers'
    timeout: 30000

# In through the door a business owner actually finds: the gate on dropping a
# pin leads with "Make a profile", and that is /join with the kind question on
# it.
- tapOn: 'Drop a pin'
- extendedWaitUntil:
    visible: 'Make a profile'
    timeout: 10000
    optional: true
- tapOn:
    text: 'Make a profile'
    optional: true
- extendedWaitUntil:
    visible: 'What are you signing up as?'
    timeout: 10000
- tapOn: 'I run a business'
- waitForAnimationToEnd:
    timeout: 1500
# The founder's replacement copy, asserted rather than only photographed: the
# old line told a business its sign-in email was the one customers would use,
# which was never true.
- assertVisible: 'This email is just for signing in.*'
- takeScreenshot: 40-business-email-copy

- tapOn:
    id: 'email-input'
- inputText: ${E2E_BIZ_EMAIL}
- pressKey: Enter
- extendedWaitUntil:
    visible: 'Pick a password'
    timeout: 10000
- tapOn:
    id: 'password-input'
- inputText: ${E2E_THROWAWAY_PASSWORD}
# The footer sits under the keyboard now (step-shell.tsx), and every field
# carries a Hide keyboard bar, so the button is reached by using it.
- tapOn: 'Hide keyboard'
- tapOn:
    id: 'create-account'
- tapOn:
    text: 'Not Now'
    optional: true

# THE OFFER, which is the first thing the form says now.
#
# The whole value proposition a business used to get was a fourteen-word radio
# subtitle on the email screen, and the word "free" appeared nowhere an owner
# could read it at all. This is the screen that decides whether a bar owner
# handed a flyer keeps going, so the picture is the evidence.
- extendedWaitUntil:
    visible: 'What a listing gets you'
    timeout: 30000
- tapOn:
    text: 'Not Now'
    optional: true
- waitForAnimationToEnd:
    timeout: 2500
- assertVisible: 'Free, always. No paid placement, no promoted listings.'
- takeScreenshot: 40c-business-offer
- tapOn:
    id: 'business-offer-continue'

# NAME AND KIND
- extendedWaitUntil:
    visible: "What's your business called?"
    timeout: 30000
- tapOn:
    id: 'business-name-input'
- inputText: 'Maestro Cafe'
- pressKey: Enter
- tapOn: 'Cafe'
- takeScreenshot: 41-business-name

# THE WAY OUT, before going any further.
#
# Steps 4 to 11 of this form had no exit at all, and step 3's evaluated to
# undefined whenever canGoBack was false - which is the normal case, because
# this screen is reached by a replace. So abandoning a half-finished listing
# meant killing the app, and killing the app lost the in-memory flag: the
# account came back reading as a traveler who had not finished, and the owner
# was asked for their first name in the one flow a business must never finish.
# The map is what the exit lands on, and "Drop a pin" is the proof it is the
# real tabs rather than onboarding.
- tapOn: 'Finish this later'
- extendedWaitUntil:
    visible: 'Drop a pin'
    timeout: 20000
- takeScreenshot: 40a-business-exit-lands-on-the-map
# ...and back in, through the row the profile now offers instead of telling a
# half-listed account to sign out.
- tapOn: 'Your profile'
- scrollUntilVisible:
    element:
      text: 'Finish listing your business'
    direction: DOWN
    timeout: 12000
- takeScreenshot: 40b-business-resume-row
- tapOn: 'Finish listing your business'
# Back in at the top of the form, which is the offer rather than the name.
- extendedWaitUntil:
    visible: 'What a listing gets you'
    timeout: 20000
- tapOn:
    id: 'business-offer-continue'
- extendedWaitUntil:
    visible: "What's your business called?"
    timeout: 20000
- tapOn:
    id: 'business-name-input'
- inputText: 'Maestro Cafe'
- pressKey: Enter
- tapOn: 'Cafe'
- tapOn:
    id: 'business-name-continue'

# WHERE IS IT — the step the founder asked for. An address first, with
# suggestions, and a marker underneath that moving does not overwrite it.
- extendedWaitUntil:
    visible: 'Where is it?'
    timeout: 15000
- takeScreenshot: 42-business-where-empty
# The city has to be CHOSEN now. It used to default to whichever launch city
# the query returned first, so an owner who never touched the chips filed
# their business in a city they never picked.
- tapOn: 'Lisbon'
- waitForAnimationToEnd:
    timeout: 2000
- tapOn:
    id: 'business-address-input'
- inputText: 'Rua da Rosa'
# Suggestions arrive on a pause in typing, not on a button. While the field
# has focus the step hides its chips and its map, so the list gets the screen
# — run 79 photographed the first suggestion sliced in half by the docked
# button, which is the bug this flow now proves is gone.
- waitForAnimationToEnd:
    timeout: 4000
- takeScreenshot: 43-business-address-typing
# By index, not by words: the suggestion repeats what is in the box above it,
# so driving this by its text matches two elements.
- tapOn:
    id: 'address-suggestion-0'
- waitForAnimationToEnd:
    timeout: 1500
# Picking sets BOTH the address text and the marker, which is the whole
# contract of this step. The map is back now that the field has let go.
- takeScreenshot: 44-business-address-and-marker
- assertVisible: 'Move the marker as much as you like.*'

- takeScreenshot: 45-business-where-final

# THE CONFIRM STEP, which is the founder's "the business will have the option
# to confirm the address and pin location after completing the where is it
# section". Reaching it writes nothing.
- tapOn:
    id: 'business-place-continue'
- extendedWaitUntil:
    visible: 'Is this right?'
    timeout: 15000
- takeScreenshot: 46-business-confirm

# REGISTERING, which the suite could not do until the workflow learned to
# delete this account afterwards. One account owns at most one business and
# register_business is not idempotent, so every run used to stop here — and
# everything past this line had never been photographed, which is how a dead
# end at step 4 reached the founder.
- tapOn:
    id: 'business-confirm-place'

# STEP 6 — how people reach you. The founder's phone and WhatsApp, which need
# no code: "Just add those as a contact option without requiring a code for
# now."
- extendedWaitUntil:
    visible: 'How do people reach you?'
    timeout: 25000
- tapOn:
    id: 'business-email-input'
- inputText: ${E2E_BIZ_EMAIL}
# Return, not the accessory bar's Done: iOS blurs a single-line field on
# submit, and taps on the Done bar do not reliably land because iOS hosts it
# in the keyboard's own window. A scroll with the keyboard still up swipes the
# docked footer rather than the scroller and moves nothing.
- pressKey: Enter
- scrollUntilVisible:
    element:
      id: 'business-phone-input'
    direction: DOWN
    timeout: 8000
- tapOn:
    id: 'business-phone-input'
- inputText: '+351 912 345 678'
# One number, not two. Tapping a second field while a keyboard is up does not
# reliably move focus under XCUITest — signed-in-tour.yml has said so since
# run 23 — and a phone pad has no Return to leave with. Run 84 typed the
# WhatsApp number into the phone field on top of the first, making 33
# characters, which the validator refuses at 30. What this step has to prove
# is the founder's ask that a number can be a contact at all; the WhatsApp
# field is asserted present and left empty, which is also the commonest real
# answer.
- assertVisible:
    id: 'business-whatsapp-input'
- takeScreenshot: 47-business-contact
# A phone pad has no Return to leave with, and the button is under it.
- tapOn: 'Hide keyboard'
- tapOn:
    id: 'business-contact-continue'

# STEP 8 — photos, and the wall. A listing cannot go on without one.
#
# The grid is ON this step now (features/business/business-photos.tsx). It
# used to be a headline, three lines of subtitle and roughly a thousand points
# of black, with a button that routed into the middle of a 1,430-line settings
# form, and the wall gated on business_detail - which is approved-only, so an
# owner with a cover on screen was told they had none.
- extendedWaitUntil:
    visible: 'Show your business'
    timeout: 20000
- assertVisible: 'One photo is the only thing we need here.'
# Dashed tiles, not void, which is half of what the audit was about and what
# the picture is evidence of. The tile is a Pressable carrying its own
# accessibilityLabel, so its spoken label is what Maestro can see (skills/
# traps); '0 of 10' is the grid's own footer and proves the read-back ran.
- assertVisible: 'Add your cover photo'
- assertVisible: '0 of 10'
- takeScreenshot: 48-business-photos
# The docked button, which is the only one on this step when there are no
# photos yet, and which now drives the grid's own picker rather than opening
# the editor. The ghost duplicate above it was removed after run 87
# photographed two identical "Add photos" on one screen.
- tapOn:
    id: 'business-photos-continue'
- waitForAnimationToEnd:
    timeout: 3000
- runFlow: ../subflows/pick-a-photo.yml
- waitForAnimationToEnd:
    timeout: 3000
# The photo has to COME BACK: '1 of 10' is the grid's own read-back of the
# row, not a local echo of the picker (runs 90 to 92 watched uploads land
# while this counter sat at zero, an ungranted column having turned the grid's
# `select *` into `permission denied` -
# 20260831120000_an_ungranted_column_hid_the_photos.sql).
#
# The patience here matches the pipeline's own contract, not a guess: each
# stage is bounded (image-upload.ts), so within 150s the photo has either
# come back or "Could not save ... so try again" is on screen. Run 95 failed
# with a 60s wait and an alert check made ten seconds after the pick - the
# render alone is allowed 90s on a cold simulator, so the check ran before
# the alert could exist and the wait gave up while the pipeline was still
# working. Wait out the budget once, recover through the app's own retry if
# it ended in the alert, then gate hard.
- extendedWaitUntil:
    visible: '1 of 10'
    timeout: 150000
    optional: true
- runFlow:
    when:
      visible: 'Could not save'
    commands:
      - tapOn: 'OK'
      - tapOn:
          text: 'Add your cover photo'
          optional: true
      - runFlow: ../subflows/pick-a-photo.yml
      - waitForAnimationToEnd:
          timeout: 3000
- extendedWaitUntil:
    visible: '1 of 10'
    timeout: 150000
- takeScreenshot: 49-business-photo-added

# THE CHIP, not a count that waits on a worker.
#
# On the live project require_photo_moderation is ON, so a fresh photo holds
# at 'pending' until the worker's next tick. This step used to wait up to two
# minutes for a label that only changes when the photo CLEARS, and it waited
# `optional: true`, so a photo that never cleared read as a pass and the eight
# screens after it were never photographed at all. What the owner sees the
# moment the upload lands is the tile chipped "In review", and Continue is
# enabled on it, because a pending photo is a photo.
- extendedWaitUntil:
    visible: 'In review'
    timeout: 30000
- assertVisible: 'Nobody sees a cover until one of these clears.'
- takeScreenshot: 50-business-photo-counted

# AND THE CODE BOX, on the same screen.
#
# The code is emailed at the contact step now, so it usually lands while
# somebody is still cropping photos. Confirming happens inline: pushing
# /business-email from here would end in router.replace('/(tabs)') and drop a
# mid-signup owner out of the flow with an unfinished listing.
# The SPOKEN label, not the printed one. The button prints "Confirm your
# email" and carries accessibilityLabel="Confirm your email with this code",
# and the traps skill's rule is that a Pressable with its own label hides its
# text from Maestro - so the printed string is unassertable even though
# 50-business-photo-counted.png shows it plainly on screen. This assertion has
# been failing since c1e481d added the label and the string in one commit.
- assertVisible: 'Confirm your email with this code'
- takeScreenshot: 50a-business-inline-code

- tapOn:
    id: 'business-photos-continue'
- extendedWaitUntil:
    visible: 'What is it like?'
    timeout: 15000
# Description and hours both open the business editor rather than
# taking text inline, and that editor has its own pictures elsewhere.
# What matters here is that a skippable step SAYS it is skippable, in
# the founder's words, and that skipping works.
- takeScreenshot: 60-business-description
- tapOn:
    text: 'Skip for now'
- extendedWaitUntil:
    visible: 'When are you open?'
    timeout: 15000
- takeScreenshot: 61-business-hours
- tapOn:
    text: 'Skip for now'
- extendedWaitUntil:
    visible: 'Anywhere else to send people?'
    timeout: 15000
- takeScreenshot: 62-business-links
- tapOn:
    text: 'Skip for now'
# THE LISTING AS A TRAVELER MEETS IT, and the send, which used to be two
# screens. The founder's "final look of how your profile appears to other
# users": the cover photo at the top, the name, whether you are open, the
# address. Not a count of what you filled in. It is badged with the one thing
# the heading cannot promise yet.
- extendedWaitUntil:
    visible: 'Here it is'
    timeout: 15000
- waitForAnimationToEnd:
    timeout: 2500
- assertVisible: 'Not on the map yet'
- takeScreenshot: 63-business-review
- tapOn:
    id: 'business-review-continue'
# THE CODE SCREEN, wearing the same shell and the same bar as every step
# before it. It used to draw no bar at all, one screen after the form had
# already filled one to 12 of 12 - so the sequence promised it was over
# before the screen that turns the lights on.
- extendedWaitUntil:
    visible: '13 of 13'
    timeout: 20000
- assertVisible:
    id: 'business-code-input'
- takeScreenshot: 64-business-code-step

# ---------------------------------------------------------------------------
# THE APP AS A BUSINESS ACTUALLY LIVES IN IT
# ---------------------------------------------------------------------------
#
# Everything above is signup. The founder's complaint was about the other
# nine-tenths: "do a fulsome review and audit of all the functionalities of
# the business account while it is logged in as a business user". None of it
# had ever been photographed, because signup has no way out but finishing and
# the mail cannot leave Resend until a domain is verified.
#
# Relaunching is the way through. `register_business` has already run by this
# point, so the session on this device belongs to a business account, and
# owesOnboarding answers false for one (routing.ts) - the app opens on the
# tabs with the listing sitting at 'unconfirmed', which is exactly the state
# the founder was in when he wrote.
- launchApp
- tapOn:
    text: 'Skip'
    optional: true
- extendedWaitUntil:
    visible: 'My business'
    timeout: 40000
# The middle tab is My business and never Travelers: §7 rule 8 says a business
# does not read a traveler discovery surface, and the tab is `hidden` rather
# than merely useless, so it cannot be reached by deep link either.
- assertNotVisible: 'Travelers'

# THE LANDING IS MY BUSINESS NOW (founder decision D8): the app itself
# switches a business off the Map tab the moment the account kind resolves,
# so the first screen an owner reads is their own listing and its next step.
- waitForAnimationToEnd:
    timeout: 3000
- takeScreenshot: 70-business-my-business

# THE MAP, reached by a tap rather than being the landing. The founder's
# words: "the map page as a business isn't used for that purpose". No faces,
# no drop-a-pin dock, no audience chip - and no city rail: the map opens on
# the listing's own city (Lisbon here), so the chips for three other cities
# are gone.
- tapOn: 'Map'
- waitForAnimationToEnd:
    timeout: 3000
- assertNotVisible: 'Mexico City'
# This listing never confirmed its email, so the strip explains the missing
# chip in the state's own words. Optional: after a mid-flow launchApp the map
# screen is not reliably addressable (see the traps skill) - the screenshot
# is the evidence either way, and it must differ from 70 this time.
- extendedWaitUntil:
    visible: 'Your business is not on the map yet.*'
    timeout: 10000
    optional: true
- takeScreenshot: 71-business-map

# THE CHAT TAB. A business's own room and the travelers who wrote in, and
# nothing shaped like a traveler's hello queue.
- tapOn: 'Chat(, .*)?'
- waitForAnimationToEnd:
    timeout: 2500
- takeScreenshot: 72-business-chat

# THE ACCOUNT PAGE, behind the header button on Map and Chat.
- tapOn: 'Map'
- waitForAnimationToEnd:
    timeout: 2000
- tapOn:
    id: 'header-account-button'
    optional: true
- waitForAnimationToEnd:
    timeout: 2000
- takeScreenshot: 73-business-account

# Relaunch rather than walking back, which signed-in-tour.yml wrote down after
# run 47: Maestro's `back` on iOS is an edge swipe, and these screens carry a
# custom header that does not answer it. `tapOn: 'My business'` is no good
# either - the account page PRINTS that phrase in its subtitle, so run 88
# tapped a sentence, stayed put, and filed a duplicate of the screen above.
- launchApp
- extendedWaitUntil:
    visible: 'My business'
    timeout: 40000
# No tab tap: the D8 landing has already selected My business, and tapping
# the phrase again risks hitting the page's own subtitle (run 88's bug).
- waitForAnimationToEnd:
    timeout: 3000
- takeScreenshot: 74-business-my-business-again
