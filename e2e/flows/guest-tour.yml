# The guest ladder, walked by a robot: cold start with no account must land
# on the tabs, and each tab must render something real from the live backend.
# The first-run tour is part of the ladder now — this flow walks all four
# pages and dismisses through the real "Just looking for now" choice, so the
# welcome scene and the transitions are in the screenshot record. (The
# signed-in flow still covers the Skip path.)
appId: com.mattmoore.samewhere
---
# State is reset by the workflow before this flow runs, not by Maestro's
# own state clear. Clearing state deletes the app's data container, and the
# over-the-air update that carries the JS under test lives inside it, so
# clearing sends the flow back to whatever JS was embedded in the binary.
# Running this by hand? Wipe "Library/Application Support/<bundle id>" in the
# app's data container first.
- launchApp
# The welcome scene: wait for the staggered entrance to finish landing.
- extendedWaitUntil:
    visible: 'Show me around'
    timeout: 20000
# The staggered entrance starts the button at alpha 0, where UIKit skips it
# in hit-testing and a too-early tap falls through — let the entrance land.
- waitForAnimationToEnd:
    timeout: 2000
- takeScreenshot: 00-welcome
- tapOn: 'Show me around'
# The glow breathes forever, so waitForAnimationToEnd only ever exits on its
# timeout — it still buys enough settle time for a crisp page screenshot.
- waitForAnimationToEnd:
    timeout: 2000
- takeScreenshot: 00a-tour-map
- swipe:
    start: 85%, 50%
    end: 15%, 50%
- waitForAnimationToEnd:
    timeout: 2000
- takeScreenshot: 00b-tour-travelers
- swipe:
    start: 85%, 50%
    end: 15%, 50%
- extendedWaitUntil:
    visible: 'Just looking for now'
    timeout: 5000
- waitForAnimationToEnd:
    timeout: 2000
- takeScreenshot: 00c-tour-choice
- tapOn: 'Just looking for now'
- takeScreenshot: 01-cold-start
- extendedWaitUntil:
    visible: 'Travelers'
    timeout: 30000
- takeScreenshot: 02-map-tab
- tapOn: 'Travelers'
- takeScreenshot: 03-travelers-guest
# The guest account screen, through the header avatar. The sign-in door
# ('I already have an account') now renders for BOTH kinds of guest; the
# named-guest branch (the 30-day sweep line) needs a guest named through a
# join-group invite link, which this suite cannot drive, so only the
# anonymous branch is walked here.
- tapOn: 'Your profile'
- extendedWaitUntil:
    visible: 'Browsing as a guest'
    timeout: 15000
- assertVisible: 'I already have an account'
- takeScreenshot: 03a-guest-account
# The pushed profile screen hides the tab bar, and run 90 proved the native
# minimal back chevron answers to no label Maestro can see - the 'Back' tap
# found nothing. Relaunch instead, the pattern the suite already trusts
# (signed-in-tour: "Relaunch rather than back"): the guest session persists,
# the intro is seen-once, so the app comes back up on the tabs.
- launchApp
- extendedWaitUntil:
    visible: 'Travelers'
    timeout: 30000
- tapOn: 'Chat(, .*)?'
# Same fade as the member Chat tab: wait it out or the shot is mid-fade.
- waitForAnimationToEnd:
    timeout: 2000
- takeScreenshot: 04-chat-guest
- tapOn: 'Map'
- takeScreenshot: 05-back-to-map

# The filters, photographed. Founder, 2026-08-28: "the all, today, tomorrow
# filters are confusing. You should instead just add a filters icon that takes
# users to a different screen and select any type of filter they want." The
# three chips are gone and everything is behind one button, so the button, the
# sheet and the count badge all need to be in the record.
#
# Tapped by ACCESSIBILITY LABEL, not by the visible text: a PressableScale
# carrying its own label is one element on iOS and the Text inside it is not
# an element at all, which is how a previous assertion failed on a screenshot
# plainly showing the string it was looking for.
- tapOn: 'Filters'
- extendedWaitUntil:
    visible: 'What to show'
    timeout: 10000
- waitForAnimationToEnd:
    timeout: 2000
- takeScreenshot: 05a-map-filters
# A category chip, not the row at the very bottom of the sheet. Run 71 tapped
# "Verified travelers only", which sits under the Done button and the tab bar:
# the element is in the hierarchy with coordinates behind the tab bar, so the
# tap landed on Travelers and the flow carried on somewhere else entirely.
# Anything asserted here has to be on screen without scrolling.
- tapOn:
    id: 'filter-category-bar'
- waitForAnimationToEnd:
    timeout: 1500
- takeScreenshot: 05b-map-filters-on
- tapOn: 'Done'
- waitForAnimationToEnd:
    timeout: 2000
# The count on the button is the whole reason a narrowed map is not a mystery.
- assertVisible: 'Filters, 1 on'
- takeScreenshot: 05c-map-filtered
# And back to an unfiltered map, so nothing after this is looking at a
# narrowed one.
- tapOn: 'Filters, 1 on'
- extendedWaitUntil:
    visible: 'What to show'
    timeout: 10000
- tapOn: 'Clear all filters'
- tapOn: 'Done'
- waitForAnimationToEnd:
    timeout: 2000

# The pin-card gate, which no flow had ever photographed. Which marker is on
# screen depends on the seeded city's data, so every step is optional and the
# tap goes by the "open to join" suffix every joinable pin's spoken label
# carries — the assertion inside the sheet is the point: one gate, one
# wording, the same "Make a profile" the drop-pin gate below leads with.
- tapOn:
    text: '.*open to join.*'
    optional: true
- waitForAnimationToEnd:
    timeout: 2000
- runFlow:
    when:
      visible: "See who's going and say hi"
    commands:
      - assertVisible: 'Make a profile'
      - takeScreenshot: 05d-pin-card-gate
      - tapOn: 'Close'
      - waitForAnimationToEnd:
          timeout: 2000

# The account-kind choice, photographed. Founder, 2026-08-28: "it should be
# clear right from the start if you are creating or signing into a business
# account or an individual account." That question now sits above the email
# field on the first signup screen, and nothing in the suite reached it — the
# signed-in flow goes to the returning-user form instead, so the screen that
# changed had no picture at all.
#
# From the map, because that is the door a guest actually finds: dropping a
# pin is gated, the gate leads with "Make a profile", and that is /join.
- tapOn: 'Drop a pin'
- extendedWaitUntil:
    visible: 'Make a profile'
    timeout: 10000
    optional: true
- takeScreenshot: 06-guest-gate
- tapOn:
    text: 'Make a profile'
    optional: true
- extendedWaitUntil:
    visible: 'What are you signing up as?'
    timeout: 10000
- takeScreenshot: 07-account-kind
# Both answers, so the picture shows what a business owner sees rather than
# only the default. The rows are a real radio: tapping one selects it.
- tapOn: 'I run a business'
- waitForAnimationToEnd:
    timeout: 2000
- takeScreenshot: 08-account-kind-business
