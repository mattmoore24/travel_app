# The guest ladder, walked by a robot: cold start with no account must land
# on the tabs, and each tab must render something real from the live backend.
# The first-run tour is part of the ladder now — this flow walks all SIX
# pages (welcome, the three tabs, the safety promise, and the account choice
# on a page of its own) and dismisses through the real "Just looking for now"
# button, so the welcome scene and the transitions are in the screenshot
# record. (The signed-in flow still covers the Skip path.)
appId: com.mattmoore.samewhere
---
# State is reset by the workflow before this flow runs, not by Maestro's
# own state clear. Clearing state deletes the app's data container, and the
# over-the-air update that carries the JS under test lives inside it, so
# clearing sends the flow back to whatever JS was embedded in the binary.
# Running this by hand? Wipe "Library/Application Support/<bundle id>" in the
# app's data container first.
- launchApp
# The welcome scene: wait for the staggered entrance to finish landing.
- extendedWaitUntil:
    visible: 'Show me around'
    timeout: 20000
# The staggered entrance starts the button at alpha 0, where UIKit skips it
# in hit-testing and a too-early tap falls through — let the entrance land.
- waitForAnimationToEnd:
    timeout: 2000
- takeScreenshot: 00-welcome
- tapOn: 'Show me around'
# The glow breathes forever, so waitForAnimationToEnd only ever exits on its
# timeout — it still buys enough settle time for a crisp page screenshot.
- waitForAnimationToEnd:
    timeout: 2000
- takeScreenshot: 00a-tour-map
- swipe:
    start: 85%, 50%
    end: 15%, 50%
- waitForAnimationToEnd:
    timeout: 2000
- takeScreenshot: 00b-tour-travelers
- swipe:
    start: 85%, 50%
    end: 15%, 50%
- extendedWaitUntil:
    visible: 'Say hi, then make plans'
    timeout: 5000
- waitForAnimationToEnd:
    timeout: 2000
- takeScreenshot: 00c-tour-chat
# THE FOURTH PAGE, AND THE REASON ANYBODY INSTALLS THIS. The three pages
# before it describe the tabs; this one says the thing that decides an
# install against GAFFL, Couchsurfing or Bumble BFF. It is deliberately last
# of the explainers, so it sits directly above the account choice rather than
# three swipes away from it. The tour is the one composition in the app that
# does not scroll, so the picture is the evidence: read it at the 1.2x
# Dynamic Type cap before believing the exit code.
- swipe:
    start: 85%, 50%
    end: 15%, 50%
- extendedWaitUntil:
    visible: 'We never ask where you are'
    timeout: 5000
- waitForAnimationToEnd:
    timeout: 2000
- takeScreenshot: 00d-tour-privacy
# THE FIFTH PAGE: the choice, on a page of its own. It used to be bolted onto
# the page above, so four controls stacked under a heading about something
# else. Asserting the heading as well as the button is what proves the split
# actually happened rather than the buttons simply moving down.
- swipe:
    start: 85%, 50%
    end: 15%, 50%
- extendedWaitUntil:
    visible: 'Ready when you are'
    timeout: 5000
- assertVisible: 'Just looking for now'
- assertVisible: 'Run a business? Put it on the map'
- waitForAnimationToEnd:
    timeout: 2000
- takeScreenshot: 00e-tour-choice
- tapOn: 'Just looking for now'
- takeScreenshot: 01-cold-start
- extendedWaitUntil:
    visible: 'Travelers'
    timeout: 30000
- takeScreenshot: 02-map-tab
- tapOn: 'Travelers'
- takeScreenshot: 03-travelers-guest
# The guest account screen, through the header avatar. The sign-in door
# ('I already have an account') now renders for BOTH kinds of guest; the
# named-guest branch (the 30-day sweep line) needs a guest named through a
# join-group invite link, which this suite cannot drive, so only the
# anonymous branch is walked here.
- tapOn: 'Your profile'
- extendedWaitUntil:
    visible: 'Browsing as a guest'
    timeout: 15000
- assertVisible: 'I already have an account'
- takeScreenshot: 03a-guest-account
# The pushed profile screen hides the tab bar, and run 90 proved the native
# minimal back chevron answers to no label Maestro can see - the 'Back' tap
# found nothing. Relaunch instead, the pattern the suite already trusts
# (signed-in-tour: "Relaunch rather than back"): the guest session persists,
# the intro is seen-once, so the app comes back up on the tabs.
- launchApp
- extendedWaitUntil:
    visible: 'Travelers'
    timeout: 30000
- tapOn: 'Chat(, .*)?'
# Same fade as the member Chat tab: wait it out or the shot is mid-fade.
- waitForAnimationToEnd:
    timeout: 2000
# The exact sentence, never a wildcard. This tab used to be one grey footnote
# floating in a screen of nothing, with no heading and no mark on it, and the
# line asserted here is the one that stops the OTHER segment reading as inert
# too: city_rooms is granted to anon, so Groups genuinely has rooms on it.
- assertVisible: 'No chats yet'
- assertVisible: 'Chats at hostels and bars are under Groups.'
- takeScreenshot: 04-chat-guest
- tapOn: 'Map'
- takeScreenshot: 05-back-to-map

# The filters, photographed. Founder, 2026-08-28: "the all, today, tomorrow
# filters are confusing. You should instead just add a filters icon that takes
# users to a different screen and select any type of filter they want." The
# three chips are gone and everything is behind one button, so the button, the
# sheet and the count badge all need to be in the record.
#
# Tapped by ACCESSIBILITY LABEL, not by the visible text: a PressableScale
# carrying its own label is one element on iOS and the Text inside it is not
# an element at all, which is how a previous assertion failed on a screenshot
# plainly showing the string it was looking for.
- tapOn: 'Filters'
- extendedWaitUntil:
    visible: 'What to show'
    timeout: 10000
- waitForAnimationToEnd:
    timeout: 2000
- takeScreenshot: 05a-map-filters
# A category chip, not the row at the very bottom of the sheet. Run 71 tapped
# "Verified travelers only", which sits under the Done button and the tab bar:
# the element is in the hierarchy with coordinates behind the tab bar, so the
# tap landed on Travelers and the flow carried on somewhere else entirely.
#
# SCROLL FIRST, because the same thing happened again in run 107 and the rule
# above is why. "Anything asserted here has to be on screen without scrolling"
# was true when it was written and the sheet has grown since: "What to show"
# now carries four description cards, and "Kind of plan" sits below the "16
# plans on the map" footer, clipped. The chip is in the hierarchy, so `tapOn`
# reports COMPLETED and lands on the footer instead, and the flow then fails
# four steps later on a count that was never turned on. scrollUntilVisible
# taps what a person would tap after the same scroll.
# centerElement, because Maestro's visibility check reads the element's
# frame and not what is drawn over it: at 100% "visible" the chip's lower
# half was still under the footer (run 113, 05b), and the tap on its centre
# landed on the footer. Scrolled to the middle of the screen it is clear.
- scrollUntilVisible:
    element:
      id: 'filter-category-bar'
    direction: DOWN
    timeout: 8000
    centerElement: true
- tapOn:
    id: 'filter-category-bar'
- waitForAnimationToEnd:
    timeout: 1500
- takeScreenshot: 05b-map-filters-on
- tapOn: 'Done'
- waitForAnimationToEnd:
    timeout: 2000
# The count on the button is the whole reason a narrowed map is not a mystery.
- assertVisible: 'Filters, 1 on'
- takeScreenshot: 05c-map-filtered
# And back to an unfiltered map, so nothing after this is looking at a
# narrowed one.
- tapOn: 'Filters, 1 on'
- extendedWaitUntil:
    visible: 'What to show'
    timeout: 10000
- tapOn: 'Clear all filters'
- tapOn: 'Done'
- waitForAnimationToEnd:
    timeout: 2000

# The plan list: the peek strip above the dock is the only place the city's
# plan count is ever stated, and expanding it is the first list-shaped
# discovery in the app. Tapped by testID (the strip is a Pressable carrying
# its own accessibility label, so its printed words are not elements on iOS).
# Every step is optional: a city the seeder has not reached renders no list.
- tapOn:
    id: 'plan-list-peek'
    optional: true
- waitForAnimationToEnd:
    timeout: 2000
- takeScreenshot: 05e-plan-list
- tapOn:
    id: 'plan-list-row-0'
    optional: true
- waitForAnimationToEnd:
    timeout: 2000
# A seeded row opens the curated pin card; the assertion inside the sheet is
# the point — the list and the marker share one selection model.
- runFlow:
    when:
      visible: 'One of our picks. Show up.'
    commands:
      - takeScreenshot: 05f-plan-list-card
      - tapOn: 'Close'
      - waitForAnimationToEnd:
          timeout: 2000
# On live-backend state a non-seeded pin can be row 0, and the gated flow
# above is the only place a card gets closed — so close whatever the row
# opened (no-op when the seeded branch already did), then collapse the list
# back to its peek so the pan segment starts on a bare map.
- tapOn:
    text: 'Close'
    optional: true
- waitForAnimationToEnd:
    timeout: 2000
- tapOn:
    id: 'plan-list-peek'
    optional: true
- waitForAnimationToEnd:
    timeout: 2000

# Pan away from the city. A blank frame with no pins used to be the whole
# answer; now the way home is a pill above the dock, asserted by its spoken
# label (a PressableScale with its own label is one element on iOS). Two
# swipes: one span is roughly the pill's distance threshold, two clear it.
- swipe:
    start: 15%, 45%
    end: 85%, 45%
- swipe:
    start: 15%, 45%
    end: 85%, 45%
- extendedWaitUntil:
    visible: 'Back to Bangkok'
    timeout: 10000
- takeScreenshot: 05g-panned-away
- tapOn: 'Back to Bangkok'
- waitForAnimationToEnd:
    timeout: 2000

# The pin-card gate, which no flow had ever photographed. Which marker is on
# screen depends on the seeded city's data, so every step is optional and the
# tap goes by the "open to join" suffix every joinable pin's spoken label
# carries — the assertion inside the sheet is the point: one gate, one
# wording, the same "Make a profile" the drop-pin gate below leads with.
- tapOn:
    text: '.*open to join.*'
    optional: true
- waitForAnimationToEnd:
    timeout: 2000
- runFlow:
    when:
      visible: "See who's going and say hi"
    commands:
      - assertVisible: 'Make a profile'
      - takeScreenshot: 05d-pin-card-gate
      - tapOn: 'Close'
      - waitForAnimationToEnd:
          timeout: 2000

# The account-kind choice, photographed. Founder, 2026-08-28: "it should be
# clear right from the start if you are creating or signing into a business
# account or an individual account." That question now sits above the email
# field on the first signup screen, and nothing in the suite reached it — the
# signed-in flow goes to the returning-user form instead, so the screen that
# changed had no picture at all.
#
# From the map, because that is the door a guest actually finds: dropping a
# pin is gated, the gate leads with "Make a profile", and that is /join.
- tapOn: 'Drop a pin'
- extendedWaitUntil:
    visible: 'Make a profile'
    timeout: 10000
    optional: true
- takeScreenshot: 06-guest-gate
- tapOn:
    text: 'Make a profile'
    optional: true
- extendedWaitUntil:
    visible: 'What are you signing up as?'
    timeout: 10000
- takeScreenshot: 07-account-kind
# Both answers, so the picture shows what a business owner sees rather than
# only the default. The rows are a real radio: tapping one selects it.
- tapOn: 'I run a business'
- waitForAnimationToEnd:
    timeout: 2000
- takeScreenshot: 08-account-kind-business

# THE PRIVACY POLICY, FROM THE CONSENT LINE (platform-privacy-in-app)
#
# 5.1.1(i) wants the policy readable inside the app, and the reader who most
# needs it is this one: signed out, being asked to agree, no account yet. The
# link is a child span of the consent sentence rather than a button, so this
# also proves the span is tappable and not decorative. 19-house-rules has a
# sibling now.
#
# The sentence carries TWO links, 'house rules' and 'privacy policy', and iOS
# publishes a paragraph as one element for the whole sentence plus one per
# link fragment (RCTParagraphComponentAccessibilityProvider). So assert the
# sentence first — if the fragments are missing this fails here, naming the
# consent line, rather than three steps later on a screen nobody expected —
# and then tap the fragment by its whole label, which the sentence element
# cannot match.
- assertVisible: '.*By continuing you agree to our.*'
- tapOn: 'privacy policy'
# NOT 'Privacy policy': the house rules screen now renders a button with
# exactly that label, so the wait stopped telling the two screens apart and a
# tap that landed on the sibling link would have gone green on the wrong
# screen. This heading is the privacy screen's own first section and nothing
# else in the app says it.
- extendedWaitUntil:
    visible: 'What we never collect'
    timeout: 15000
# The exact sentence a human reads, per change-review: never loosen this to a
# wildcard. It is the strongest promise the app makes and it leads the screen.
- assertVisible:
    text: 'We never collect your location. The map only shows plans people typed in themselves.'
- takeScreenshot: 08a-privacy-policy
- tapOn: 'Done'
- extendedWaitUntil:
    visible: 'What are you signing up as?'
    timeout: 15000

# THE MAP REMEMBERS THE CITY (map-remembers-your-city): choose a city, kill
# the app, and the choice survives the relaunch — this is the whole point and
# only an E2E step proves it. Chips are PressableScales carrying their own
# labels, the same addressing 'Filters' already trusts. Denpasar because it
# is the second chip and needs no rail scroll.
- launchApp
- extendedWaitUntil:
    visible: 'Travelers'
    timeout: 30000
# 'Denpasar.*', not 'Denpasar': since 2026-09-04 the chip is the featured
# rail's row and carries its plan count ("Denpasar 10"), and Maestro's text
# match is the whole string. Run 114 failed here on the bare name.
- tapOn: 'Denpasar.*'
- waitForAnimationToEnd:
    timeout: 2500
- launchApp
- extendedWaitUntil:
    visible: 'Travelers'
    timeout: 30000
- extendedWaitUntil:
    visible: 'Denpasar.*'
    timeout: 15000
- assertVisible:
    text: 'Denpasar.*'
    selected: true
- takeScreenshot: 09-city-remembered

# ─────────────────────────────────────────────────────────────────────────
# THE IN-APP BROWSER (platform-in-app-browser)
#
# A business's Website and Menu now open OVER the app with a Done button
# instead of throwing the reader into Safari. "Does it look right" is the
# only question that matters about a presentation style, so this segment
# exists to photograph it.
#
# Every navigation STEP is optional, and that is not the banned kind of
# loosening: what is uncertain here is Maestro's REACH, not the app's
# behaviour. The route to a business page runs through the plan list, whose
# rows only exist where a seeded launch business has a live post and the map
# is drawn below city scale. The kind-to-opener rule itself is asserted
# properly, in jest, in src/features/business/__tests__/links.test.ts.
#
# ARRIVING is not optional, though, and that is the difference from the first
# version of this segment: with every step optional and nothing asserted, a
# run that never left the map took two screenshots of the map and reported
# green. A hard assertion goes in front of each screenshot, so a run that did
# not get there fails instead of photographing whatever was on screen.
#
# The seeded businesses all carry exactly one link, a 'Website'
# (20260827150000_seed_business_content.sql), so that row is present wherever
# this route is. If it is ever missing, seed it back - do not loosen this.
#
# The screenshots are the evidence. Note that iOS renders SFSafariViewController
# in a separate process, so 10a may come back empty; the frame around it is
# still the proof that the app did not leave.
#
# OPEN THE LIST FIRST. This segment used to start by tapping the business row
# directly, and it could never have passed: the step above it relaunches the
# app to prove the city survives a cold start, so what is on screen here is
# the MAP, and the row it wants lives inside the plan list that relaunch
# collapsed. Every step to it was optional, so the miss was silent right up
# to the hard assert on 'Website', which then failed with a message about a
# link rather than about a list that was never opened. Tapped by testID for
# the same reason the 05e segment does it: the peek strip is a Pressable
# carrying its own accessibility label, so its printed words are not elements
# on iOS.
# WHICH TAB IS THIS? The step above relaunches the app to prove the city
# survives a cold start, and its proof that the app came up is `assertVisible:
# 'Travelers'` - which is the TAB BAR LABEL, present on every tab. So nothing
# in this flow has ever asserted it is on the MAP before doing map things.
#
# Run 106 is why that matters. 09-city-remembered photographed the map in
# Denpasar; the screenshot taken immediately after the row tap below
# photographed the TRAVELERS TAB showing Bangkok. onSelectBusiness only sets
# local state and cannot navigate, and no crash report was written, so the
# cause is still open - but a run that started on the wrong tab would look
# identical to that one right up to the failure, and this flow could not tell
# the difference. Now it can: 'Drop a pin' is on the map and nowhere else.
- assertVisible: 'Drop a pin'
- tapOn:
    id: 'plan-list-peek'
- waitForAnimationToEnd:
    timeout: 2000
# ...and SCROLL to the row, which is the other half of reaching it. The ON
# TONIGHT section renders LAST inside the sheet, after every dated pin section
# (src/features/pins/plan-list.tsx), so in a city with six plans it sits below
# the fold at the half detent the tap above opens. Opening the list is not the
# same as being able to see the bottom of it, and a tap that lands on nothing
# reports "no venue" when the truth is "not scrolled".
- scrollUntilVisible:
    element:
      id: 'whats-on-row-0'
    direction: DOWN
    timeout: 10000
# ─────────────────────────────────────────────────────────────────────────
# HARD, and it is the first hard step for a reason. Every step after it used
# to be optional up to the assertVisible on 'Website' three steps later, so a
# run that could not reach the row went red pointing at a missing LINK. That
# misdirection cost hours once already, and sent a wrong diagnosis to the
# founder with it. Now the scroll above does the reaching and this says
# whether the row is really there: if it fails, the venue genuinely has no
# live post. The workflow seeds the launch venues' posts back before every
# run (select seed_launch_business_content(); the row is a 72-hour pin and
# was gone within days of every hand seeding), so a red here now means the
# seeder found nothing to do or the row moved, never that nobody ran it.
# The row is matched by the venue's name: its spoken label is
# "<name>. <what's on line>", and the line is the post's own title for a
# standing post, which is what the seeder writes (run 119 photographed
# "Puri Garden Ubud. Come and say hello" and a regex still waiting for
# ", something on tonight", the line a venue with NO live post gets).
# Denpasar, because the relaunch above proved that city remembered, and
# Puri Garden Ubud is its seeded venue.
# By id, not by the venue's name: the venue's MAP CHIP carries the same name
# in its own label, and a tap driven by the words went to the chip's
# coordinates, under the tab bar, which is how runs 106 and 120 both
# photographed the Travelers tab here. The name is asserted, then the row is
# tapped where it is.
- assertVisible: 'Puri Garden Ubud\..*'
# And settled first: the sheet rides a translateY spring, and the scroll
# above can nudge its detent, so a tap fired mid-spring uses a stale frame
# (another way the row's tap could land on the tab bar).
- waitForAnimationToEnd:
    timeout: 3000
- tapOn:
    id: 'whats-on-row-0'
# A photograph OF THE TAP, before anything is asserted about it. Run 105
# failed the next step twice and its failure screenshot showed the app on a
# different tab with the default city - taken thirty seconds later, so it
# could not say whether the sheet never opened or the app went somewhere
# afterwards. This one is taken immediately, so the next run distinguishes
# those two without anybody having to reason about it.
- takeScreenshot: 09a-what-the-business-row-did
# HARD, for the same reason the tap above is, and this is the step run 97
# proved was still optional one too long. The row was tapped and COMPLETED,
# the sheet's 'See the whole page' WARNED (not found), the scroll WARNED, and
# the flow finally went red on 'Website' - pointing at a missing link when
# what was actually missing was the sheet three steps earlier. That is the
# exact misdirection the paragraph above this describes, left in place
# because only the FIRST of the four steps had been made hard.
#
# So: if the sheet does not open on a business's post, this says so here.
#
# 30s, not the 10s it waited: the tap COMPLETED and the wait elapsed 11s
# later, in a run where the photo pipeline was also overrunning a 45s budget,
# so "the sheet is slow to fetch its business on a cold simulator" and "the
# sheet has no such link" both fit the evidence and 10s cannot tell them
# apart. A hard assertion with a budget the machine can actually meet can: if
# this still fails at 30s, the link is genuinely not there and the place to
# look is place-sheet.tsx's viewerIsBusiness branch, not the clock.
- extendedWaitUntil:
    visible: 'See the whole page'
    timeout: 30000
- tapOn:
    text: 'See the whole page'
- scrollUntilVisible:
    element:
      text: 'Website'
    direction: DOWN
    timeout: 10000
    optional: true
# Hard: this is the business page with its links on it, or there is no
# picture worth taking.
- assertVisible: 'Website'
- takeScreenshot: 10-business-page-links
# Hard too, and for the same reason: 10a is a photograph OF THIS TAP. Nothing
# can be asserted after it - SFSafariViewController's chrome belongs to
# another process and Maestro cannot see into it - so the tap on a row that
# was just asserted is what makes the next screenshot mean anything.
- tapOn: 'Website'
- waitForAnimationToEnd:
    timeout: 4000
- takeScreenshot: 10a-in-app-browser
