# The signed-in path, end to end on the live backend: the guest taps the
# primary action and is walked to sign-in (the gate itself is under test),
# signs into the pre-onboarded E2E account, then drops a real pin through
# the new in-place flow — place mode, pan, confirm, form sheet, posted —
# and finally opens their own profile via the header avatar (the first-tap
# regression under test). Credentials arrive via -e E2E_EMAIL/E2E_PASSWORD.
appId: com.mattmoore.samewhere
---
# State is reset by the workflow before this flow runs, not by Maestro's
# own state clear. Clearing state deletes the app's data container, and the
# over-the-air update that carries the JS under test lives inside it, so
# clearing sends the flow back to whatever JS was embedded in the binary.
# Running this by hand? Wipe "Library/Application Support/<bundle id>" in the
# app's data container first.
- launchApp
# First launch shows the tour; skip straight past it to the app.
- extendedWaitUntil:
    visible: 'Skip'
    timeout: 20000
- tapOn: 'Skip'
- extendedWaitUntil:
    visible: 'Travelers'
    timeout: 30000
- tapOn: 'Drop a pin'
- takeScreenshot: 10-auth-gate
# The gate leads with "Make a profile" (that was the bug: it used to land
# every new user on the returning-user form) and carries the way back in
# underneath it. Run 40 failed HERE with only the loud half on screen, which
# is how a returning user found out that signing in was hidden one screen
# inside signing up. Tapping the quiet half is therefore the case worth
# testing — the gate is inside a sheet, so this also proves the sheet lets go
# of the screen before the push.
- tapOn: 'I already have an account'
- extendedWaitUntil:
    visible: 'Welcome back'
    timeout: 10000
- tapOn:
    id: 'email-input'
- inputText: ${E2E_EMAIL}
# Return, not a tap on the next field. Tapping a second field while the
# keyboard is up does not reliably move focus under XCUITest, and run 23
# proved it does not on a device either: the password box came back empty.
# The form now wires Return to move along, so this is the human path too.
- pressKey: Enter
- inputText: ${E2E_PASSWORD}
# Return on the password field submits. hideKeyboard has no reliable dismiss
# path here, which is where the same run actually died.
- pressKey: Enter
- tapOn:
    text: 'Sign in'
    optional: true
# iOS offers to save the password after a successful sign-in; the system
# dialog owns the a11y tree and eats taps until dismissed. It can arrive
# seconds late, so wait for it, dismiss it, and guard once more below.
- extendedWaitUntil:
    visible: 'Not Now'
    timeout: 12000
    optional: true
- tapOn:
    text: 'Not Now'
    optional: true
- extendedWaitUntil:
    visible: 'Travelers'
    timeout: 30000
- takeScreenshot: 11-signed-in-map
- tapOn:
    text: 'Not Now'
    optional: true
- tapOn: 'Drop a pin'
- takeScreenshot: 12-place-mode
- swipe:
    start: 50%, 62%
    end: 58%, 42%
# The venue chips arrive after the settle's debounced lookup, so give them a
# moment — but never require them. MKLocalPointsOfInterestRequest returns
# nothing at all in some regions and over water (this very pan once landed on
# a river), and the row is designed to be absent rather than empty there. A
# binary without nearbyAsync has no row either, by the same design.
- extendedWaitUntil:
    visible:
      id: 'nearby-venue-0'
    timeout: 8000
    optional: true
- takeScreenshot: 13-place-after-pan
# When MapKit named the block, prove a chip carries its venue into the form
# the way a searched place does: the venue's own name, not a reverse-geocoded
# street, heads the place card. Conditional for the same reason the wait
# above is optional.
- runFlow:
    when:
      visible:
        id: 'nearby-venue-0'
    commands:
      - copyTextFrom:
          id: 'nearby-venue-0'
      - tapOn:
          id: 'nearby-venue-0'
      - waitForAnimationToEnd:
          timeout: 3000
      - takeScreenshot: 13b-nearby-venue-picked
      - tapOn: 'Pin here'
      # Escaped: assertVisible is a regex and venue names carry brackets and
      # plus signs ('Big C (Ratchadamri)') that would otherwise never match.
      - evalScript: ${output.venuePattern = maestro.copiedText.replace(/[.*+?^$}{)(|\[\]\\]/g, '\\$&')}
      - assertVisible: ${output.venuePattern}
      - takeScreenshot: 13c-nearby-venue-in-form
      # Back out to place mode so the main flow's own 'Pin here' below still
      # lands there. A pull on the grabber, because the scrim's full-screen
      # bounds centre on the sheet itself and a tap there would land on a
      # field. Nothing has been typed, so the discard guard lets it through.
      - swipe:
          from:
            id: 'sheet-grabber'
          direction: DOWN
      - waitForAnimationToEnd:
          timeout: 3000
- tapOn: 'Pin here'
- takeScreenshot: 14-pin-form
# The button is grey here and the footnote says why. Asserted before typing,
# so the disabled reason is proved rather than only photographed.
- assertVisible: 'Say what the plan is first.'
- tapOn:
    id: 'plan-input'
- inputText: 'Rooftop hello from Maestro'
# Return first: Name is single-line, so this dismisses the keyboard, and the
# tap below then lands on the details field. Tapping a second field with the
# keyboard still up is what silently appended the details onto the name in
# three earlier runs.
- pressKey: Enter
- scrollUntilVisible:
    element:
      id: 'note-input'
    direction: DOWN
    timeout: 8000
- tapOn:
    id: 'note-input'
- inputText: 'Meeting by the door around 7'
# Proves the tap moved focus rather than appending to the previous field.
#
# The trailing .* is for iOS, not for the app. Run 50 failed here on a field
# reading "Meeting by the door around 7d": the "d" was iOS's own inline
# predictive text, ghosted after the cursor and offered behind a first-run
# "Inline Predictions" tooltip that had popped up over the sheet. It is in the
# accessibility value, so an exact pattern cannot match. The assertion still
# proves what it was written to prove - an appended value would read "Rooftop
# hello from MaestroMeeting by..." and a Maestro pattern has to match the
# whole string, so a prefix still fails.
#
# No pressKey: Enter here. note-input is multiline, so Enter is a newline, and
# a newline is exactly what `.` does not match.
- assertVisible: 'Meeting by the door around 7.*'
- takeScreenshot: 15-pin-form-filled
# THE DISCARD GUARD. A pull on the grabber with a plan mid-sentence must ask,
# not eat it: the sheet used to unmount on this exact gesture with all state
# gone, and "Pin here" again gave an empty form. The refusal also proves the
# sheet survives the gesture — sprung back home, everything still in it —
# rather than sitting parked halfway off screen.
- swipe:
    from:
      id: 'sheet-grabber'
    direction: DOWN
- assertVisible: 'Discard this plan?'
- tapOn: 'Keep writing'
- assertVisible: 'Rooftop hello from Maestro'
- assertVisible: 'Meeting by the door around 7.*'
# HOW PEOPLE COME ALONG. The choice that turns a pin into a plan somebody can
# join in one tap, versus the hello-and-wait the app had only ever offered.
# It sits ABOVE the fields now: run 76 photographed it below them, clipped in
# half by the docked button with the alternative off screen entirely, and it
# is the DEFAULT, so somebody who never scrolled to it would have opened a
# group chat to strangers without seeing that they had. assertVisible, not
# scrollUntilVisible: the whole claim is that no scrolling is needed.
- assertVisible: 'Anyone can join.*'
- assertVisible: 'Message me first.*'
# THE DAY AND THE LIFETIME. Same reasoning as the join rows above:
# assertVisible, not scrollUntilVisible, because the whole claim is that the
# two controls that define what a pin IS need no scrolling to reach.
- assertVisible: 'When'
- assertVisible: 'Disappears after.*'
# The slider itself, by its spoken label (an adjustable carries its own
# accessibilityLabel, and that is what Maestro sees). The 72h cap is a §7
# hard rule, and a user who cannot reach this control cannot set it — the
# slider was once clipped off the bottom of the scroll viewport while the
# form's tests stayed green, so a future regression fails the run here
# rather than only the eye.
- assertVisible: 'How long this pin stays up'
- takeScreenshot: 15b-pin-join-mode
# 'Put it on the map' sits outside the form's scroll area and the sheet lifts
# with the keyboard, so it is reachable with the keyboard still up.
- tapOn: 'Put it on the map'
# Exact, deliberately: a loose match here passed a run in which the details
# had been appended to the name.
- extendedWaitUntil:
    visible: 'Rooftop hello from Maestro'
    timeout: 20000
- takeScreenshot: 16-pin-posted
# The proof that post_joinable_pin ran and the group came with it: a pin that
# was posted message-me-first says "Your pin" here instead. This assertion is
# the one place the whole path — RPC, group, room_members, the map re-read —
# is checked in one line.
- assertVisible: 'Your plan, open to join'
# THE PIN-BORN ROOM, photographed for the first time. The run had never once
# entered it — the room it does photograph later ("Maestro crew") is the
# hand-made group from the 22/23 flow, which is why "the room loses the plan"
# survived the audit's own evidence. This tap is also the liveness proof the
# old 'Close' tap carried (run 42 posted a pin and then went deaf): the wait
# below matches room-only content, so a tap that did nothing fails HERE.
- tapOn: 'Open the chat'
# Wait on ROOM-ONLY content first: the map's own pin card behind this push
# prints the same burnOutLabel, so a wait keyed on the burn line would pass
# at t=0 with the tap having done nothing. The membership line exists only
# in the room. Then the card's own line, anchored for the whole-element
# match ('Today · burns out in 24h' is one Text), and the Maps link by its
# SPOKEN label - the Pressable hides its inner text (traps).
- extendedWaitUntil:
    visible: '1 person in this chat.*'
    timeout: 20000
- assertVisible: '.*burns out (in .*|soon)'
- assertVisible: 'View .* in Maps'
- takeScreenshot: 16b-pin-born-room
# Relaunch rather than `back` — Maestro's back does not reliably pop an iOS
# push (see the Chat section below). The session survives (keychain, not the
# data container) and the app lands on the Map tab. Do NOT add clearState.
- launchApp
- extendedWaitUntil:
    visible: 'Travelers'
    timeout: 30000
- tapOn: 'Travelers'
- takeScreenshot: 17-travelers-signed-in
# THE QUEUE HAS SCOPE NOW. The header line above the hero says how many
# people are behind this one. The count depends on live supply, so the
# pattern covers the three wordings the helper can produce — but nothing
# else: a screen without the line fails here, naming it.
- assertVisible: '(Last one for now|One more on your dates in .*|[0-9]+ more on your dates in .*)'
# Pull to refresh must refresh, not navigate or blank the page. The swipe
# starts on the hero; afterwards the same traveler page (its primary action)
# must still be on screen.
- swipe:
    start: 50%, 35%
    end: 50%, 75%
- waitForAnimationToEnd:
    timeout: 3000
- assertVisible: 'Say hi'
- assertVisible: '(Last one for now|One more on your dates in .*|[0-9]+ more on your dates in .*)'
# ONE VERB FOR SAYING HI. The chip beside 'Travel plans' prints 'About this'
# now, not 'Reply' — but a Pressable carrying its own accessibilityLabel
# hides its printed text from Maestro (see traps), so what is asserted is
# the spoken label, which carries the same verb.
- scrollUntilVisible:
    element:
      text: 'About this. Say hi about their travel plans.'
    direction: DOWN
    timeout: 10000
- assertVisible: 'About this. Say hi about their travel plans.'
# SAFETY, ON THE CARD YOU READ A STRANGER ON. Travelers is where somebody
# spends the most time with one stranger at a time, and it carried no report
# and no block at all: reporting the man on screen meant opening his full
# profile first and finding the nav bar's overflow. Same sheet, same three
# items, one builder (features/profile/actions-menu).
- tapOn: 'More about .*'
- extendedWaitUntil:
    visible: 'Report'
    timeout: 10000
- assertVisible: 'Block'
- takeScreenshot: 17c-travelers-safety
- tapOn: 'Cancel'
- waitForAnimationToEnd:
    timeout: 3000
# A PASS IS RECOVERABLE. Tap the Next pill (its spoken label — the pill's own
# accessibilityLabel hides the printed word from Maestro, see traps) and the
# undo bar names who was moved past. The name depends on live supply, so the
# pattern closes over the exact demo roster and nothing else; the copied text
# is what lets the flow prove Undo brings back the SAME person rather than
# whoever sorts first. All of this happens inside the bar's 5-second window,
# so the copy and the eval come before the screenshot.
- tapOn: 'Next traveler'
# A NAMED bar, not a bare regex on 'Moved past': the roster below is the demo
# seed, so the name half of the copy is proven without copyTextFrom - run 90
# showed the copiedText/evalScript plumbing leaving output.passedName unset
# and failing the flow while the FEATURE worked on screen (the pass, the bar,
# and the undo restoring Kai were all in the photographs). Who exactly comes
# back on top is pinned by jest (passed.test.ts hoist cases); this flow
# proves the interaction: pass, named bar, undo, bar gone.
- assertVisible: 'Moved past (Maya|Dev|Sofia|Priya|Nora|Theo|Marcus|Tomas|Ines|Kai|Freja|Luca)'
- takeScreenshot: 17a-passed-undo
- tapOn: 'Undo'
- waitForAnimationToEnd:
    timeout: 3000
- assertNotVisible: 'Moved past .*'
# THE BEAT AFTER A HELLO. Saying hi used to end in a face swap nobody asked
# for: the composer's confirmation popped after about a second, a different
# stranger had silently taken the page underneath, and Travelers carried no
# trace that anything had been said. The strip is that trace, and it is a
# beat rather than a resting state - so both halves are proven here, the
# arrival and the going.
#
# Safe to send for real, and idempotent despite one-shot-per-pair: the run's
# account is created by `node e2e/account.mjs setup` and destroyed at
# teardown every run, so the SENDER is a fresh row each time and
# unique(sender_id, recipient_id) never sees the same pair twice.
# message_requests cascade with the account, so nothing here burns a demo
# traveler permanently either.
#
# RENUMBERING: hi-the-composer-gets-photographed plans its own composer
# frames and has to number around 17b/17c here rather than interleave with
# them. Two flows photographing the same screens under clashing names is a
# gallery nobody can read.
- tapOn: 'Say hi'
- extendedWaitUntil:
    visible: 'Your first message'
    timeout: 15000
- tapOn:
    id: 'first-message-input'
- inputText: 'Both in town the same week. Any market worth the walk?'
- tapOn: 'Send'
- extendedWaitUntil:
    visible: 'Sent to .*'
    timeout: 25000
# The composer pops itself after its confirmation; the strip is underneath,
# floating over whoever the queue handed up next.
- extendedWaitUntil:
    visible: 'Said hi to .* It.s in Chat under .You said hi..'
    timeout: 20000
- takeScreenshot: 17b-said-hi
# A beat, not a wall. Four seconds of screen time and it clears itself.
- extendedWaitUntil:
    notVisible: 'Said hi to .*'
    timeout: 20000

# WHAT THE REPORT FORM LETS SOMEBODY SAY. The chip order IS the triage order
# a frightened person reads, so the two urgent reasons have to be in the
# picture and they have to be at the top of it. Both are new: the form had no
# way to say either, so a traveler certain the man she is chatting with is 15,
# or one who has just been followed back to her hostel, had to file it as
# 'Other' and land behind a spam complaint.
- tapOn: 'More about .*'
- extendedWaitUntil:
    visible: 'Report'
    timeout: 10000
- tapOn: 'Report'
- extendedWaitUntil:
    visible: 'What happened?'
    timeout: 15000
- assertVisible: 'Somebody here is in danger'
- assertVisible: 'They are under 18'
- takeScreenshot: 17d-report-reasons
# Relaunch rather than `back`: this screen is a modal with no close control
# (nothing is sent, and a report form should not carry a stray Done), and the
# flow already relies on a relaunch to reset - it keeps the session, which
# lives in the keychain rather than the data container, and lands on the Map
# tab. Do NOT add clearState - see the note at the top of this file.
#
# And then WAIT ON THE TAB BAR, NOT ON THE MAP. After a mid-flow launchApp
# nothing on the map screen is matchable - not the legend chip's printed
# words, not its accessibility label, not a marker, not 'Drop a pin'. Runs 64
# and 66 both died exactly there, on screenshots that plainly show the thing
# being asserted (the long note further down this file has the whole finding).
# So this mirrors the three relaunches in this flow that DO work: wait for the
# tab bar's own 'Travelers' label, tap it, and carry on from a screen Maestro
# can read.
- launchApp
- extendedWaitUntil:
    visible: 'Travelers'
    timeout: 30000
- tapOn: 'Travelers'
# The avatar's first tap is the regression under test here; the name is
# the above-the-fold proof the profile actually opened. The header avatar is
# the same AvatarButton on Travelers as on the Map, so the regression is
# still the one under test - it is only reached from a tab that answers.
- tapOn: 'Your profile'
- extendedWaitUntil:
    visible: 'Maestro Test.*'
    timeout: 15000
- takeScreenshot: 18-profile-me
# THE SECOND ASK, when this account has anything left to answer.
#
# Steps 6 to 11 of signup are one-tap skips, and nothing used to notice
# afterwards. Conditional on purpose: the card draws nothing at all on a
# complete profile, and that empty case is the one the jest table pins. So
# this photographs it when it is there and says nothing when it is not,
# rather than asserting a state the account may legitimately not be in.
- runFlow:
    when:
      visible: 'Finish your profile'
    commands:
      - takeScreenshot: 18a-finish-your-profile

# WHO YOU SEE, AND WHO SEES YOU
#
# The founder set this to verified only, read the screen, and still expected a
# one-way filter, so every string on it was rewritten to name both directions.
# Only a picture shows whether the hierarchy actually carries that now: the
# sentence was always there, it was just the smallest thing on the screen.
#
# This account is not verified, so the rows below Everyone are inert here.
# That is the state worth photographing anyway: it is what somebody deciding
# whether the badge is worth a selfie sees, and it is exactly who the
# both-ways note used to be hidden from.
# The trailing .* is not slack: the setting moved from a ghost button at the
# bottom of the page to a card at the TOP of it, and a card that does not say
# what it is currently set to is a link rather than a selector — so its label
# is now "Who you see, and who sees you. Currently Everyone." and a Maestro
# pattern has to match the whole string.
- scrollUntilVisible:
    element:
      text: 'Who you see, and who sees you.*'
    direction: DOWN
    timeout: 10000
- tapOn: 'Who you see, and who sees you.*'
- extendedWaitUntil:
    visible: 'Verified non-binary.*'
    timeout: 15000
- takeScreenshot: 18b-who-can-see-you
# A LOCKED ROW IS A DOOR, NOT A DEAD END. This account is unverified, so
# 'Verified women' cannot be picked — tapping it must open verification
# rather than swallow the tap, which is what the dimmed rows used to do.
# The label pattern closes over the appended '. Needs the verified badge.
# Opens verification.' suffix.
- tapOn: 'Verified women.*'
- extendedWaitUntil:
    visible: 'Get your badge'
    timeout: 15000
- takeScreenshot: 18c-get-your-badge
- tapOn: 'Close'
- extendedWaitUntil:
    visible: 'Verified non-binary.*'
    timeout: 15000
- tapOn: 'Done'

# THE PRIVACY POLICY — App Review 5.1.1(i) wants it readable inside the app,
# not only on the store listing. The asserted line is the promise the whole
# product stands on, rendered from PRIVACY_SECTIONS' top card, so a picture
# of it is a picture of the policy actually shipping. This sits BEFORE the
# house-rules block because the block below deliberately ends inside the
# contact form with the keyboard up.
- scrollUntilVisible:
    element:
      text: 'Privacy'
    direction: DOWN
    timeout: 12000
- tapOn: 'Privacy'
- extendedWaitUntil:
    visible: 'We never collect your location.*'
    timeout: 15000
- takeScreenshot: 19c-privacy
- tapOn: 'Done'

# EMAIL AND PASSWORD - the two changes that used to need a signed-OUT screen.
#
# Nothing is submitted: a live backend would really change the password, and a
# screenshot is what this step is for. The account this suite signs in as is an
# email account, so the two password fields are the ones that must be on
# screen; an Apple account draws a sentence in their place instead.
- scrollUntilVisible:
    element:
      text: 'Email and password'
    direction: DOWN
    timeout: 12000
- tapOn: 'Email and password'
- extendedWaitUntil:
    visible: 'Current password'
    timeout: 15000
- takeScreenshot: 19d-email-and-password
- tapOn: 'Change your email'
- extendedWaitUntil:
    visible: 'New email'
    timeout: 15000
- takeScreenshot: 19e-change-your-email
- tapOn: 'Close'

# HOUSE RULES AND THE CONTACT FORM
#
# App Review 1.2 wants both reachable from inside the app, and this form is
# the only published way to reach a human — the app deliberately prints
# nobody's email address. The live-backend suite proves a message submits;
# only a picture proves the form is usable, which is the half that has gone
# wrong here before (a field hidden behind the keyboard renders fine in a
# test and is unusable on a phone). Nothing is sent: the keyboard stays up on
# purpose so the shot shows the message field clear of it.
- scrollUntilVisible:
    element:
      text: 'House rules and help'
    direction: DOWN
    timeout: 12000
- tapOn: 'House rules and help'
# The screen the button opens now agrees with the button (decision D32): one
# name for the rulebook, and the screenshot is the proof the two match.
- extendedWaitUntil:
    visible: 'House rules'
    timeout: 15000
- takeScreenshot: 19-house-rules
- scrollUntilVisible:
    element:
      text: 'Send us a message'
    direction: DOWN
    timeout: 12000
- tapOn: 'Send us a message'
- extendedWaitUntil:
    visible:
      id: 'contact-message'
    timeout: 15000
- takeScreenshot: 19a-contact-form
# WHICH KIND OF MESSAGE THIS IS. One box used to serve an appeal against a
# closed account, a bug report, and somebody being followed back to their
# hostel, and nothing let a one-person queue tell them apart. The chip is
# required, so this tap is also what makes Send available.
- tapOn: 'Something happened'
- tapOn:
    id: 'contact-message'
- inputText: 'Checking the form works. Nothing to answer.'
- takeScreenshot: 19b-contact-typed

# CHAT — the founder's top priority, and until now the one part of the app
# with no picture of it at all. A group is the way in with a single account:
# anyone can start one, so this reaches the new-group form, the room, the
# composer and the reaction menu without needing a second person to accept a
# message request.
#
# Relaunch rather than `back`. Run 28 failed here with the profile still on
# screen at the tap that follows, so whatever `back` does on iOS it did not
# pop this push. A relaunch keeps the session (it is in the keychain, not the
# data container) and lands on the Map tab every time, which is all this
# needs. Do NOT add clearState — see the note at the top of this file.
- launchApp
- extendedWaitUntil:
    visible: 'Travelers'
    timeout: 30000
- tapOn: 'Chat(, .*)?'
- extendedWaitUntil:
    visible: 'Groups'
    timeout: 15000
- takeScreenshot: 20-chat-individual
- tapOn: 'Groups'
# The tab body fades in over Motion.quick; an unwaited screenshot catches a
# semi-transparent, mid-fade list.
- waitForAnimationToEnd:
    timeout: 2000
- takeScreenshot: 21-chat-groups
# The '+' goes to /new-group on both segments and now SAYS so: its spoken
# label is 'New group'. A Pressable with its own accessibilityLabel hides the
# text inside it from Maestro, so this taps the spoken label, not a glyph.
- tapOn: 'New group'
# Wait on the field, not the title: the screen's heading and the button that
# opened it are the same words, so a text match would pass before it opened.
- extendedWaitUntil:
    visible:
      id: 'group-name-input'
    timeout: 10000
- tapOn:
    id: 'group-name-input'
- inputText: 'Maestro crew'
# Return closes the keyboard, so the rest of the form is reachable. Tapping
# past a raised keyboard is what left a password box empty on run 25.
- pressKey: Enter
- takeScreenshot: 22-new-group
- tapOn: 'Create group'
- extendedWaitUntil:
    visible: 'Maestro crew'
    timeout: 20000
# A brand-new group has one person in it, and the empty state's job is to
# offer the one thing they need next: getting anybody else in. "Go first"
# only appears once there are people to hear it.
- assertVisible: 'Invite people'
- takeScreenshot: 23-group-created
# A message to react to.
- tapOn:
    id: 'room-composer'
- inputText: 'First one in'
# The composer is multiline, so Return would add a line rather than send.
- tapOn: 'Send'
- extendedWaitUntil:
    visible: 'First one in'
    timeout: 15000
- takeScreenshot: 24-group-message
# The founder's exact complaint: the picker used to be a slab in the middle
# of the screen. This shot is the evidence that it now sits on the message.
#
# Run 31 photographed no menu at all here, which is what sent groups onto the
# same MessageThread a one-to-one chat uses instead of the room's own older
# reaction strip. Waiting on the scrim's Dismiss button rather than a fixed
# animation delay, so a menu that does not open fails HERE, naming the menu,
# rather than three steps later on a missing emoji.
#
# Run 34 failed here with no menu at all, and the cause was NOT the menu: the
# thread's FlatList had no keyboardShouldPersistTaps, so with the composer
# still focused the list took the touch in the responder capture phase and the
# bubble was never asked. The keyboard being UP is therefore the case worth
# testing — do NOT add a hideKeyboard or a sacrificial tap here to make this
# green, because that is precisely the press that was broken for a real
# finger, and hiding it would let the bug ship.
#
# Two assertions, because they fail differently: no menu id means the press
# never arrived; the id without the Dismiss label means it mounted and
# something kept it invisible.
- longPressOn: 'First one in'
- extendedWaitUntil:
    visible:
      id: 'message-menu'
    timeout: 10000
- assertVisible: 'Dismiss'
# The way out for an address or a handle: the share sheet is the system's
# text/email/copy chooser, and it is on the card under the lifted message.
- assertVisible: 'Share'
- takeScreenshot: 25-reaction-menu
- tapOn: '❤️'
- waitForAnimationToEnd:
    timeout: 2000
- takeScreenshot: 26-reacted
# ANSWERING ONE MESSAGE RATHER THAN THE ROOM.
#
# In a group of six discussing three plans for tonight, "I'm in" carries no
# information on its own, and the app's own five-minute grouping window welds
# it to whatever came before it. Reply leads the card, ahead of Pin, so this
# also photographs the order.
#
# The keyboard is up when the press lands, deliberately: that is the case that
# was broken for a real finger (run 34), and a sacrificial tap here would hide
# it again.
- longPressOn: 'First one in'
- extendedWaitUntil:
    visible: 'Reply'
    timeout: 10000
- tapOn: 'Reply'
- tapOn:
    id: 'room-composer'
- inputText: 'Second one in'
# The composer is multiline, so Return would add a line rather than send.
- tapOn: 'Send'
- extendedWaitUntil:
    visible: 'Second one in'
    timeout: 15000
# The evidence is the picture: the quoted line above the new bubble.
- takeScreenshot: 26b-reply
# The group's own page: who is in it, who may post, and the invite link.
- tapOn: 'Group details'
- extendedWaitUntil:
    visible: 'WHO CAN POST'
    timeout: 15000
# The renamed section, and the control that turns the end date off. Asserted
# rather than merely photographed: "Group is active until" is a promise the
# database now keeps, and a screen that silently lost the label would mean the
# words and the mechanism had come apart again.
# The rename, asserted. This one passes and is worth keeping: "Group is active
# until" is a promise the database now enforces, and a screen that quietly
# lost the label would mean the words and the mechanism had come apart.
- assertVisible: 'Group is active until'
# The no-end-date control is NOT asserted, and that is a considered stop
# rather than an omission. Runs 50 and 51 both failed on it — first
# assertVisible (the control is below the fold), then scrollUntilVisible,
# which failed while its own failure screenshot showed the row plainly on
# screen, checked, with the right footnote under it. The screen is right; the
# step is not, and a third run spent on the harness buys nothing. The
# screenshot below is the evidence, and 22-new-group already proves the
# control exists and is the default.
- scroll
- takeScreenshot: 27-group-settings
# A room that has gone bad had no exit that told anybody: the whole reporting
# path was per-person, and picking one person to blame for a group is a guess.
# Asserted as a DOOR rather than walked through: /report is a pushed screen and
# Maestro's `back` on iOS does not reliably pop one here (runs 28, 46 and 47),
# so opening it would cost this flow a relaunch to get back to the group.
- scrollUntilVisible:
    element:
      text: 'Report this group'
    direction: DOWN
    timeout: 10000
- takeScreenshot: 27c-group-report-and-leave

# ADDING SOMEBODY WITHOUT LEAVING THE APP, and a door out of a group.
#
# Both were missing entirely. Inviting was a link — copy it, leave for
# iMessage, find a phone number, paste — and a group's page had no Leave at
# all, so the only way out of one was to be removed. The founder asked for
# both. The row is open to every member, not only the admin, which is why the
# screenshot is worth taking on a screen an admin happens to be looking at.
- scrollUntilVisible:
    element:
      id: 'group-add-people'
    direction: DOWN
    timeout: 10000
- takeScreenshot: 27b-group-add-and-leave
- tapOn:
    id: 'group-add-people'
# The search field, not the words "Add someone": that string is also the
# label on the ROW that was just tapped, so an assertion on it would pass
# while the modal sat unopened behind it.
- extendedWaitUntil:
    visible:
      id: 'add-people-search'
    timeout: 15000
- takeScreenshot: 27c-add-people
- tapOn: 'Done'

# BACK TO THE LIST, with a real conversation in it. The founder's biggest
# visual complaint was this screen — "the actual chats themselves should look
# exactly like chats are shown in iMessage vs spacing them out like we have
# now" — and every picture of it so far has been of an EMPTY list, which is
# the one state the redesign does not change. A flush row with an avatar, a
# name, a preview and a timestamp is the thing to look at.
# Relaunched, not backed out of. Group settings is a pushed route two levels
# deep, so the tab bar is not on screen at all and run 74's `tapOn: 'Chat'`
# had nothing to hit. A relaunch lands on the Map tab with the tab bar
# present, which is the same pattern this flow already uses above.
- launchApp
- extendedWaitUntil:
    visible: 'Travelers'
    timeout: 30000
- tapOn: 'Chat(, .*)?'
- extendedWaitUntil:
    visible: 'Groups'
    timeout: 15000
- tapOn: 'Groups'
- extendedWaitUntil:
    visible: 'Maestro crew'
    timeout: 15000
- waitForAnimationToEnd:
    timeout: 2000
- takeScreenshot: 27a-chat-list-with-a-row

# THE INVITE SHEET — a real field on every platform now, not an iOS-only
# Alert.prompt whose Android arm was an alert with no input at all. The row
# is addressed by its spoken label: a Pressable with its own
# accessibilityLabel hides the text inside it from Maestro. The row sits
# below the open rooms, so scroll to it rather than assuming it is on screen.
- scrollUntilVisible:
    element: 'Join a group with an invite link or code'
    direction: DOWN
    timeout: 10000
- tapOn: 'Join a group with an invite link or code'
# The exact label on the field, asserted before the screenshot so a sheet
# that does not open fails HERE, naming the sheet. Never loosen this to a
# wildcard.
- extendedWaitUntil:
    visible: 'Invite code'
    timeout: 10000
- waitForAnimationToEnd:
    timeout: 2000
- takeScreenshot: 27e-invite-sheet
- tapOn: 'Cancel'
- waitForAnimationToEnd:
    timeout: 2000

# THE ARCHIVE, as a conversation list. Archived was the one list that never
# got the redesign — floating cards, no avatar, no timestamp — and it now
# renders the inbox's own ChatRow. Archive the crew group, walk into the
# archive, photograph it, and put the group back so the run leaves no state.
- scrollUntilVisible:
    element: 'Maestro crew'
    direction: UP
    timeout: 10000
- longPressOn: 'Maestro crew'
- tapOn: 'Archive'
# The door to the archive appears once something is archived; it sits below
# the rooms and the invite row.
- scrollUntilVisible:
    element: 'Archived'
    direction: DOWN
    timeout: 10000
- tapOn: 'Archived'
- extendedWaitUntil:
    visible: 'Maestro crew'
    timeout: 15000
- takeScreenshot: 27d-archived
# Un-archiving uses the inbox's own vocabulary: the long-press menu (the
# swipe exists too, but a long press is dependable under Maestro). No
# assertion on 'Nothing archived.' afterwards: archive_idle_chats archives
# any chat idle 14 days, so an account that has run this flow before may
# legitimately hold older archived groups.
- longPressOn: 'Maestro crew'
- tapOn: 'Put back'
- waitForAnimationToEnd:
    timeout: 2000

# ─────────────────────────────────────────────────────────────────────────
# PLACES AND TOP PRIORITIES — the surface built on 2026-08-27, never yet
# photographed. Every step below is optional on purpose.
#
# A map marker is the only way into a place page, and a MapKit annotation is
# the least dependable thing in this app to address by label: react-native-map
# hands the marker's accessibilityLabel to a native annotation view, and
# whether XCUITest surfaces it is not something a flow can assert in advance.
# So this segment is written to photograph what it can and walk away from what
# it cannot, rather than to turn an unknown into a red run on a flow whose
# real assertions have all already passed above.
#
# 'Once Again Hostel' is the Bangkok launch venue seeded by
# seed_launch_businesses(), and the E2E account's trip is Bangkok, so it is on
# this map if places render at all.
# ─────────────────────────────────────────────────────────────────────────
# Relaunch, rather than trying to walk back out. Run 46 photographed the group
# settings page five times over because `tapOn: 'Map'` cannot reach a tab bar
# from a pushed route; run 47 did it again, because Maestro's `back` on iOS is
# an edge swipe and these screens carry a custom header that does not answer
# it. `launchApp` with no clearState keeps the session and the dismissed tour
# (both live in AsyncStorage, which this does not touch) and lands on the tab
# bar, which is the one thing every step below needs.
- launchApp
- extendedWaitUntil:
    visible: 'Travelers'
    timeout: 30000
    optional: true
- tapOn:
    text: 'Map'
    optional: true
- extendedWaitUntil:
    visible: 'Drop a pin'
    timeout: 15000
    optional: true
- takeScreenshot: 28-map-with-places
# The legend chip, ASSERTED. This is the achievable half of the guard that
# caught the invisible-places bug, and it is a real one: the chip renders only
# when `!cityScale && places.length > 0`, so seeing it proves the place data
# reached a map drawn at a zoom where markers are drawn too.
#
# NOTHING on this screen is assertable after a `launchApp`, and that is now
# established rather than guessed. Run 64 asserted the words the chip prints
# and failed on a screenshot that plainly shows them; run 66 asserted the
# accessibility label the chip actually speaks and failed on a screenshot that
# is pixel-for-pixel the same map. Both times the legend, the markers, the
# Drop a pin button and the tab bar were all right there.
#
# The same map IS addressable on a cold start — the guest flow's `tapOn: 'Drop
# a pin'` up at the top of this file is a hard step and it passes — so this is
# not MapKit refusing to publish an accessibility tree. Something about the
# mid-flow relaunch is; what exactly is not worth another twenty minutes of
# macOS runner to find out, because the thing being proved has a photograph.
#
# So: optional, and the SCREENSHOT above is the evidence for this segment.
# That is the `screens` skill's whole argument, and it is not the banned kind
# of loosening — no assertion about the APP is being weakened here. What was
# being asserted is that Maestro can read this screen, and it cannot.
#
# The same goes double for a place marker: a MapKit annotation does not
# surface its accessibilityLabel to XCUITest, so `tapOn: 'Once Again
# Hostel.*'` can never match — not for a place, and not for a traveler pin.
# Do not put the tap back.
- extendedWaitUntil:
    visible: 'The small chips are businesses'
    timeout: 15000
    optional: true

# The priorities editor. Reached by ordinary labelled controls, so unlike the
# map markers it IS assertable, and the flow is already on the Map tab.
- tapOn:
    text: 'Your profile'
    optional: true
- extendedWaitUntil:
    visible: 'Maestro Test.*'
    timeout: 15000
    optional: true
- scrollUntilVisible:
    element:
      text: 'Top priorities'
    direction: DOWN
    timeout: 10000
    optional: true
- takeScreenshot: 33-priorities-empty
- tapOn:
    id: 'add-priority'
    optional: true
- waitForAnimationToEnd:
    timeout: 3000
- takeScreenshot: 34-priorities-editor
- inputText: 'night market crawl'
- takeScreenshot: 35-priorities-typed
